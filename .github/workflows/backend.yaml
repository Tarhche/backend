name: Backend CI and CD

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io
  HETZNER_SSH_ADDRESS: ${{ secrets.HETZNER_SSH_ADDRESS }}
  HETZNER_SSH_ENDPOINT: ${{ secrets.HETZNER_SSH_USER }}@${{ secrets.HETZNER_SSH_ADDRESS }}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: blacksmith-8vcpu-ubuntu-2404

    strategy:
      matrix:
        image:
          - name: backend
            target: production-blog
          - name: workload-controlplane
            target: production-workload-controlplane
          - name: workload-ingress
            target: production-workload-ingress
          - name: workload-orchestrator
            target: production-workload-orchestrator

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run unit tests
        run: |
          go test ./... -v -race -cover

      - name: Build ${{ matrix.image.name }} image
        uses: ./.github/actions/docker-build
        with:
          context: .
          dockerfile: Dockerfile
          image-name: ${{ matrix.image.name }}
          target: ${{ matrix.image.target }}
          push: false
          container-registry: ${{ env.REGISTRY }}

  # The vmhost runs the node's VMs, and they stop when it is redeployed, so its
  # image is not rebuilt on every push as the others are: it is tagged with
  # the fingerprint of what it is built from (scripts/vmhost-fingerprint.sh),
  # and built, pushed and deployed only when no image has that tag yet.
  vmhost-fingerprint:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    permissions:
      contents: read
      packages: read

    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      image: ${{ steps.fingerprint.outputs.image }}
      built: ${{ steps.registry.outputs.built }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true

      - name: Fingerprint the vmhost
        id: fingerprint
        run: |
          fingerprint=$(./scripts/vmhost-fingerprint.sh)
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')

          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/$owner/workload-vmhost:$fingerprint" >> "$GITHUB_OUTPUT"

          echo "the vmhost's fingerprint is $fingerprint, a hash of:"
          ./scripts/vmhost-fingerprint.sh --manifest

      # a pull request that may not read the registry builds the image, as
      # though it were new, which is the safe way to be wrong.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is it built already
        id: registry
        env:
          IMAGE: ${{ steps.fingerprint.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE is built already: the vmhosts are left as they are"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "$IMAGE is new: it is built, and on $GITHUB_REF_NAME pushed and deployed"
          fi

  # Built on a pull request only when it changes, to hold the Dockerfile's
  # vmhost stages to building; pushed only from main.
  vmhost-image:
    runs-on: blacksmith-8vcpu-ubuntu-2404

    needs:
      - ci
      - vmhost-fingerprint

    if: ${{ needs.vmhost-fingerprint.outputs.built != 'true' }}

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the vmhost image, and push it from main
        uses: ./.github/actions/docker-build
        with:
          context: .
          dockerfile: Dockerfile
          image-name: workload-vmhost
          target: production-workload-vmhost
          tags: ${{ needs.vmhost-fingerprint.outputs.image }}
          push: ${{ format('refs/heads/{0}', github.event.repository.default_branch) == github.ref }}
          container-registry: ${{ env.REGISTRY }}
          container-registry-username: ${{ github.actor }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  # The engine's own tests, which need KVM: a GitHub-hosted amd64 runner has
  # it once its device is opened to the runner's user.
  vmhost-integration:
    runs-on: ubuntu-24.04

    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run the KVM integration tests
        run: make test-vmhost-integration

  build-and-push-images:
    runs-on: blacksmith-8vcpu-ubuntu-2404

    if: ${{ format('refs/heads/{0}', github.event.repository.default_branch) == github.ref }}

    permissions:
      packages: write
      contents: read

    needs:
      - ci

    strategy:
      matrix:
        image:
          - name: backend
            target: production-blog
          - name: workload-controlplane
            target: production-workload-controlplane
          - name: workload-ingress
            target: production-workload-ingress
          - name: workload-orchestrator
            target: production-workload-orchestrator

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and push ${{ matrix.image.name }} image
        uses: ./.github/actions/docker-build
        with:
          context: .
          dockerfile: Dockerfile
          image-name: ${{ matrix.image.name }}
          target: ${{ matrix.image.target }}
          push: true
          container-registry: ${{ env.REGISTRY }}
          container-registry-username: ${{ github.actor }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    # the vmhost image is built only when it changed, so its job being skipped
    # is as good as its having succeeded.
    if: >-
      ${{
        !cancelled() &&
        format('refs/heads/{0}', github.event.repository.default_branch) == github.ref &&
        needs.build-and-push-images.result == 'success' &&
        needs.vmhost-fingerprint.result == 'success' &&
        needs.vmhost-integration.result == 'success' &&
        (needs.vmhost-image.result == 'success' || needs.vmhost-image.result == 'skipped')
      }}

    permissions:
      packages: read
      contents: read

    needs:
      - build-and-push-images
      - vmhost-fingerprint
      - vmhost-image
      - vmhost-integration

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # What the workload's VMs need, beyond what the services needed before:
      #
      #   secrets
      #     BACKEND_WORKLOAD_SNAPSHOT_S3_ENDPOINT, _ACCESS_KEY, _SECRET_KEY,
      #     _USE_SSL, _BUCKET: the bucket VM snapshots are kept in. Unset, the
      #     blog's S3 (BACKEND_S3_*), in a bucket named workload-snapshots,
      #     which the backend makes on first use.
      #
      #   variables
      #     BACKEND_WORKLOAD_KVM_GID: /dev/kvm's group id on the host, which
      #       the infrastructure repository's scripts/kvm-check.sh prints.
      #       Required: the vmhosts are given it, and a deploy without it fails
      #       saying so.
      #     BACKEND_WORKLOAD_VMHOST_MEMORY_LIMIT, _CPUS_LIMIT: what each vmhost
      #       container may use, which every VM on its node lives in (4g and 2
      #       unless said).
      #     BACKEND_WORKLOAD_VMHOST_MEMORY, _CPUS, _DISK, _MAX_CONCURRENT_BOOTS,
      #       _PORT_RANGE: the budget a node offers VMs (unset: 80% of the
      #       memory limit less 512 MiB, the CPUs it may use, 200 GiB), how
      #       many boot at once (4), and the host ports theirs are published
      #       on (20000-29999).
      #     BACKEND_WORKLOAD_VM_*, BACKEND_WORKLOAD_SNAPSHOT_USER_MAX: the
      #       control plane's images, bounds, quotas and Docker VM defaults;
      #       BACKEND_WORKLOAD_DOCKER_READY_TIMEOUT, _PULL_TIMEOUT,
      #       BACKEND_WORKLOAD_NODE_REQUEST_TIMEOUT, _CONCURRENCY: how long a
      #       Docker VM and a request to a node are waited for. Unset keeps the
      #       code's defaults (infrastructure/configs/workloadVM.go).
      #
      #   set by this workflow
      #     WORKLOAD_VMHOST_IMAGE: the vmhost image, tagged with its
      #       fingerprint.
      #
      # BACKEND_DOCKER_HOST and BACKEND_WORKLOAD_ORCHESTRATOR_ADVERTISE_HOST
      # are no longer read: the orchestrators run nothing on a docker daemon.
      - name: Deploy services
        run: |
          # Setup ssh key
          echo '${{ secrets.HETZNER_SSH_PRIVATE_KEY }}' > ~/hetzner-key.pem
          chmod 400 ~/hetzner-key.pem

          mkdir -p ~/.ssh
          ssh-keyscan -H $HETZNER_SSH_ADDRESS >> ~/.ssh/known_hosts 2>/dev/null

          # Ensure remote directory exists
          ssh -q -i ~/hetzner-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $HETZNER_SSH_ENDPOINT << 'EOF' >/dev/null 2>&1
            mkdir -p /tmp/deployment_backend
            chown ${{ secrets.HETZNER_SSH_USER }}:${{ secrets.HETZNER_SSH_USER }} /tmp/deployment_backend

          EOF

          # Copy files
          scp -q -i ~/hetzner-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -r ./compose.*.yaml $HETZNER_SSH_ENDPOINT:/tmp/deployment_backend/ 2>/dev/null

          # Connect and deploy services. What the remote shell prints comes back
          # to the job log: a deploy that fails says why here rather than only in
          # a container nobody is looking at. The commands themselves are never
          # echoed -- no set -x -- so the exports below stay out of it.
          ssh -q -i ~/hetzner-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $HETZNER_SSH_ENDPOINT << 'EOF'
            # a failure surfaces through the exit status, which set -e propagates back through ssh
            set -e
            trap 'rm -rf /tmp/deployment_backend' EXIT

            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin > /dev/null

            export WEB_URL='${{ secrets.WEB_URL }}'
            export SERVICE_URL='${{ secrets.SERVICE_URL }}'

            export MONGO_USERNAME='${{ secrets.MONGO_USERNAME }}'
            export MONGO_PASSWORD='${{ secrets.MONGO_PASSWORD }}'

            export BACKEND_NATS_URL='${{ secrets.BACKEND_NATS_URL }}'
            export BACKEND_PRIVATE_KEY='${{ secrets.BACKEND_PRIVATE_KEY }}'

            export BACKEND_MONGO_HOST='mongodb'
            export BACKEND_MONGO_PORT='27017'
            export BACKEND_MONGO_SCHEME='mongodb'
            export BACKEND_MONGO_DATABASE_NAME='${{ secrets.BACKEND_MONGO_DATABASE_NAME }}'
            export BACKEND_MONGO_USERNAME='${{ secrets.MONGO_USERNAME }}'
            export BACKEND_MONGO_PASSWORD='${{ secrets.MONGO_PASSWORD }}'

            export BACKEND_MAIL_SMTP_PASSWORD='${{ secrets.BACKEND_MAIL_SMTP_PASSWORD }}'
            export BACKEND_MAIL_SMTP_HOST='${{ secrets.BACKEND_MAIL_SMTP_HOST }}'
            export BACKEND_MAIL_SMTP_FROM='${{ secrets.BACKEND_MAIL_SMTP_FROM }}'
            export BACKEND_MAIL_SMTP_USERNAME='${{ secrets.BACKEND_MAIL_SMTP_USERNAME }}'
            export BACKEND_MAIL_SMTP_PORT='${{ secrets.BACKEND_MAIL_SMTP_PORT }}'

            export BACKEND_S3_ENDPOINT='${{ secrets.BACKEND_S3_ENDPOINT }}'
            export BACKEND_S3_SECRET_KEY='${{ secrets.BACKEND_S3_SECRET_KEY }}'
            export BACKEND_S3_ACCESS_KEY='${{ secrets.BACKEND_S3_ACCESS_KEY }}'
            export BACKEND_S3_USE_SSL='${{ secrets.BACKEND_S3_USE_SSL }}'
            export BACKEND_S3_BUCKET_NAME='${{ secrets.BACKEND_S3_BUCKET_NAME }}'

            export BACKEND_WORKLOAD_CONTROLPLANE_URL='${{ secrets.BACKEND_WORKLOAD_CONTROLPLANE_URL }}'
            export BACKEND_WORKLOAD_INGRESS_DOMAIN='${{ secrets.BACKEND_WORKLOAD_INGRESS_DOMAIN }}'
            export BACKEND_WORKLOAD_TUNNEL_ADDRESSES='${{ secrets.BACKEND_WORKLOAD_TUNNEL_ADDRESSES }}'

            # each service's own certificate and the authority to check the
            # other end against, as the PEM itself. ca.key is deliberately not
            # here: nothing that runs needs it.
            export BACKEND_WORKLOAD_TUNNEL_CA_CERT='${{ secrets.BACKEND_WORKLOAD_TUNNEL_CA_CERT }}'
            export BACKEND_WORKLOAD_TUNNEL_SERVER_NAME='${{ secrets.BACKEND_WORKLOAD_TUNNEL_SERVER_NAME }}'
            export BACKEND_WORKLOAD_INGRESS_TUNNEL_CERT='${{ secrets.BACKEND_WORKLOAD_INGRESS_TUNNEL_CERT }}'
            export BACKEND_WORKLOAD_INGRESS_TUNNEL_KEY='${{ secrets.BACKEND_WORKLOAD_INGRESS_TUNNEL_KEY }}'
            export BACKEND_WORKLOAD_ORCHESTRATOR_01_TUNNEL_CERT='${{ secrets.BACKEND_WORKLOAD_ORCHESTRATOR_01_TUNNEL_CERT }}'
            export BACKEND_WORKLOAD_ORCHESTRATOR_01_TUNNEL_KEY='${{ secrets.BACKEND_WORKLOAD_ORCHESTRATOR_01_TUNNEL_KEY }}'
            export BACKEND_WORKLOAD_ORCHESTRATOR_02_TUNNEL_CERT='${{ secrets.BACKEND_WORKLOAD_ORCHESTRATOR_02_TUNNEL_CERT }}'
            export BACKEND_WORKLOAD_ORCHESTRATOR_02_TUNNEL_KEY='${{ secrets.BACKEND_WORKLOAD_ORCHESTRATOR_02_TUNNEL_KEY }}'
            export BACKEND_WORKLOAD_ORCHESTRATOR_03_TUNNEL_CERT='${{ secrets.BACKEND_WORKLOAD_ORCHESTRATOR_03_TUNNEL_CERT }}'
            export BACKEND_WORKLOAD_ORCHESTRATOR_03_TUNNEL_KEY='${{ secrets.BACKEND_WORKLOAD_ORCHESTRATOR_03_TUNNEL_KEY }}'

            # the ports arbitrary TCP arrives on, and what an orchestrator will connect
            # a stream to beyond the services it offers by name.
            export BACKEND_WORKLOAD_INGRESS_FORWARDS='${{ secrets.BACKEND_WORKLOAD_INGRESS_FORWARDS }}'
            export BACKEND_WORKLOAD_TUNNEL_ALLOWED_TARGETS='${{ secrets.BACKEND_WORKLOAD_TUNNEL_ALLOWED_TARGETS }}'
            # the public half of the key the blog signs access tokens with; the
            # orchestrators verify against it and never sign anything
            export BACKEND_PUBLIC_KEY='${{ secrets.BACKEND_PUBLIC_KEY }}'

            # the bucket VM snapshots are kept in: the nodes write and read
            # them, the control plane deletes them. Unset, the blog's S3.
            export BACKEND_WORKLOAD_SNAPSHOT_S3_ENDPOINT='${{ secrets.BACKEND_WORKLOAD_SNAPSHOT_S3_ENDPOINT }}'
            export BACKEND_WORKLOAD_SNAPSHOT_S3_ACCESS_KEY='${{ secrets.BACKEND_WORKLOAD_SNAPSHOT_S3_ACCESS_KEY }}'
            export BACKEND_WORKLOAD_SNAPSHOT_S3_SECRET_KEY='${{ secrets.BACKEND_WORKLOAD_SNAPSHOT_S3_SECRET_KEY }}'
            export BACKEND_WORKLOAD_SNAPSHOT_S3_USE_SSL='${{ secrets.BACKEND_WORKLOAD_SNAPSHOT_S3_USE_SSL }}'
            export BACKEND_WORKLOAD_SNAPSHOT_S3_BUCKET='${{ secrets.BACKEND_WORKLOAD_SNAPSHOT_S3_BUCKET }}'

            # the nodes' engines: the vmhost image, tagged with its
            # fingerprint, /dev/kvm's group on this host, and what each vmhost
            # may use and offers its VMs.
            export WORKLOAD_VMHOST_IMAGE='${{ needs.vmhost-fingerprint.outputs.image }}'
            export BACKEND_WORKLOAD_KVM_GID='${{ vars.BACKEND_WORKLOAD_KVM_GID }}'
            export BACKEND_WORKLOAD_VMHOST_MEMORY_LIMIT='${{ vars.BACKEND_WORKLOAD_VMHOST_MEMORY_LIMIT }}'
            export BACKEND_WORKLOAD_VMHOST_CPUS_LIMIT='${{ vars.BACKEND_WORKLOAD_VMHOST_CPUS_LIMIT }}'
            export BACKEND_WORKLOAD_VMHOST_MEMORY='${{ vars.BACKEND_WORKLOAD_VMHOST_MEMORY }}'
            export BACKEND_WORKLOAD_VMHOST_CPUS='${{ vars.BACKEND_WORKLOAD_VMHOST_CPUS }}'
            export BACKEND_WORKLOAD_VMHOST_DISK='${{ vars.BACKEND_WORKLOAD_VMHOST_DISK }}'
            export BACKEND_WORKLOAD_VMHOST_MAX_CONCURRENT_BOOTS='${{ vars.BACKEND_WORKLOAD_VMHOST_MAX_CONCURRENT_BOOTS }}'
            export BACKEND_WORKLOAD_VMHOST_PORT_RANGE='${{ vars.BACKEND_WORKLOAD_VMHOST_PORT_RANGE }}'

            # what VMs boot from, what one VM and one person may have, and the
            # Docker VM made for a container or a stack. Unset keeps the
            # code's defaults.
            export BACKEND_WORKLOAD_VM_DEFAULT_IMAGE='${{ vars.BACKEND_WORKLOAD_VM_DEFAULT_IMAGE }}'
            export BACKEND_WORKLOAD_VM_DOCKER_IMAGE='${{ vars.BACKEND_WORKLOAD_VM_DOCKER_IMAGE }}'
            export BACKEND_WORKLOAD_VM_MIN_MEMORY='${{ vars.BACKEND_WORKLOAD_VM_MIN_MEMORY }}'
            export BACKEND_WORKLOAD_VM_MIN_DISK='${{ vars.BACKEND_WORKLOAD_VM_MIN_DISK }}'
            export BACKEND_WORKLOAD_VM_DOCKER_MIN_MEMORY='${{ vars.BACKEND_WORKLOAD_VM_DOCKER_MIN_MEMORY }}'
            export BACKEND_WORKLOAD_VM_DOCKER_MIN_DISK='${{ vars.BACKEND_WORKLOAD_VM_DOCKER_MIN_DISK }}'
            export BACKEND_WORKLOAD_VM_MAX_CPUS='${{ vars.BACKEND_WORKLOAD_VM_MAX_CPUS }}'
            export BACKEND_WORKLOAD_VM_MAX_MEMORY='${{ vars.BACKEND_WORKLOAD_VM_MAX_MEMORY }}'
            export BACKEND_WORKLOAD_VM_MAX_DISK='${{ vars.BACKEND_WORKLOAD_VM_MAX_DISK }}'
            export BACKEND_WORKLOAD_VM_USER_MAX_VMS='${{ vars.BACKEND_WORKLOAD_VM_USER_MAX_VMS }}'
            export BACKEND_WORKLOAD_VM_USER_CPUS='${{ vars.BACKEND_WORKLOAD_VM_USER_CPUS }}'
            export BACKEND_WORKLOAD_VM_USER_MEMORY='${{ vars.BACKEND_WORKLOAD_VM_USER_MEMORY }}'
            export BACKEND_WORKLOAD_VM_USER_DISK='${{ vars.BACKEND_WORKLOAD_VM_USER_DISK }}'
            export BACKEND_WORKLOAD_VM_MAX_LIFETIME='${{ vars.BACKEND_WORKLOAD_VM_MAX_LIFETIME }}'
            export BACKEND_WORKLOAD_VM_CPU_OVERCOMMIT='${{ vars.BACKEND_WORKLOAD_VM_CPU_OVERCOMMIT }}'
            export BACKEND_WORKLOAD_VM_DOCKER_DEFAULT_CPUS='${{ vars.BACKEND_WORKLOAD_VM_DOCKER_DEFAULT_CPUS }}'
            export BACKEND_WORKLOAD_VM_DOCKER_DEFAULT_MEMORY='${{ vars.BACKEND_WORKLOAD_VM_DOCKER_DEFAULT_MEMORY }}'
            export BACKEND_WORKLOAD_VM_DOCKER_DEFAULT_DISK='${{ vars.BACKEND_WORKLOAD_VM_DOCKER_DEFAULT_DISK }}'
            export BACKEND_WORKLOAD_VM_DOCKER_DEFAULT_PORTS='${{ vars.BACKEND_WORKLOAD_VM_DOCKER_DEFAULT_PORTS }}'
            export BACKEND_WORKLOAD_VM_DOCKER_DEFAULT_INGRESS='${{ vars.BACKEND_WORKLOAD_VM_DOCKER_DEFAULT_INGRESS }}'
            export BACKEND_WORKLOAD_VM_DOCKER_DEFAULT_EGRESS='${{ vars.BACKEND_WORKLOAD_VM_DOCKER_DEFAULT_EGRESS }}'
            export BACKEND_WORKLOAD_VM_DOCKER_DEFAULT_PERSISTENT_DISK='${{ vars.BACKEND_WORKLOAD_VM_DOCKER_DEFAULT_PERSISTENT_DISK }}'
            export BACKEND_WORKLOAD_VM_DOCKER_DEFAULT_LIFETIME='${{ vars.BACKEND_WORKLOAD_VM_DOCKER_DEFAULT_LIFETIME }}'
            export BACKEND_WORKLOAD_SNAPSHOT_USER_MAX='${{ vars.BACKEND_WORKLOAD_SNAPSHOT_USER_MAX }}'

            # how long a Docker VM's dockerd, a pull in it and a request to a
            # node are waited for, which the control plane and the nodes read
            # alike.
            export BACKEND_WORKLOAD_DOCKER_READY_TIMEOUT='${{ vars.BACKEND_WORKLOAD_DOCKER_READY_TIMEOUT }}'
            export BACKEND_WORKLOAD_DOCKER_PULL_TIMEOUT='${{ vars.BACKEND_WORKLOAD_DOCKER_PULL_TIMEOUT }}'
            export BACKEND_WORKLOAD_NODE_REQUEST_TIMEOUT='${{ vars.BACKEND_WORKLOAD_NODE_REQUEST_TIMEOUT }}'
            export BACKEND_WORKLOAD_NODE_REQUEST_CONCURRENCY='${{ vars.BACKEND_WORKLOAD_NODE_REQUEST_CONCURRENCY }}'

            export APP_IMAGE='${{ secrets.APP_IMAGE }}'
            export WORKLOAD_CONTROLPLANE_IMAGE='${{ secrets.WORKLOAD_CONTROLPLANE_IMAGE }}'
            export WORKLOAD_INGRESS_IMAGE='${{ secrets.WORKLOAD_INGRESS_IMAGE }}'
            export WORKLOAD_ORCHESTRATOR_IMAGE='${{ secrets.WORKLOAD_ORCHESTRATOR_IMAGE }}'

            export OTEL_EXPORTER_OTLP_INSECURE='${{ secrets.OTEL_EXPORTER_OTLP_INSECURE }}'
            export OTEL_EXPORTER_OTLP_PROTOCOL='${{ secrets.OTEL_EXPORTER_OTLP_PROTOCOL }}'
            export OTEL_RESOURCE_ATTRIBUTES='${{ secrets.OTEL_RESOURCE_ATTRIBUTES }}'
            export OTEL_EXPORTER_OTLP_ENDPOINT='${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}'
            export OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT='${{ secrets.OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT }}'

            # Run Docker Compose
            cd /tmp/deployment_backend/

            # deploy brings a compose file's services up, or only those it
            # names, and none of what they depend on. --wait holds the deploy
            # until every replica passes the healthcheck defined in the compose
            # file, for up to the seconds given, so a version that cannot serve
            # traffic fails the job instead of being reported as deployed. A
            # service that never gets there says so in its own words: what it
            # printed before it gave up is the only thing that explains why.
            deploy() {
                seconds=$1 file=$2 project=$3
                shift 3

                if docker compose -f "$file" --project-name "$project" up --pull always --detach --no-deps --wait --wait-timeout "$seconds" "$@"; then
                    return 0
                fi

                echo "::error::$project${1:+ ($*)} did not come up; what it said follows"
                docker compose -f "$file" --project-name "$project" ps -a "$@"
                docker compose -f "$file" --project-name "$project" logs --tail 50 --no-color "$@"

                return 1
            }

            # a vmhost holds its node's VMs, and they stop when it does. It is
            # recreated only when what it runs changed -- its image, tagged with
            # its fingerprint, or its configuration -- which compose's config
            # hash says, and it is never touched by its orchestrator's deploy.
            # It is given longer to come up: before it serves, it advances the
            # PID counter past every PID its engine recorded and takes its VMs
            # over.
            deploy_vmhost() {
                file=$1 project=$2 service=$3

                wanted=$(docker compose -f "$file" --project-name "$project" config --hash "$service" | awk '{print $2}')
                running=$(docker ps --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=$service" --format '{{.Label "com.docker.compose.config-hash"}}')

                if [ -n "$wanted" ] && [ "$running" = "$wanted" ]; then
                    echo "$service is as it was ($WORKLOAD_VMHOST_IMAGE): left running, with its VMs"
                    return 0
                fi

                echo "$service changed: recreating it with $WORKLOAD_VMHOST_IMAGE, which stops its node's VMs"
                deploy 600 "$file" "$project" "$service"
            }

            deploy 180 compose.app.yaml app
            deploy 180 compose.workload-controlplane.yaml workload-controlplane
            deploy 180 compose.workload-ingress.yaml workload-ingress

            # a node whose vmhost does not come up still gets its orchestrator,
            # which says its VMs fail and why; the job fails once every node
            # has been deployed.
            failed=
            for node in 01 02 03; do
                deploy_vmhost compose.workload-orchestrator-$node.yaml workload-orchestrator-$node workload-vmhost-$node || failed="$failed workload-vmhost-$node"
                deploy 180 compose.workload-orchestrator-$node.yaml workload-orchestrator-$node workload-orchestrator-$node || failed="$failed workload-orchestrator-$node"
            done

            if [ -n "$failed" ]; then
                echo "::error::did not come up:$failed"
                exit 1
            fi
          EOF
