name: Backend CI and CD

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io
  HETZNER_SSH_ADDRESS: ${{ secrets.HETZNER_SSH_ADDRESS }}
  HETZNER_SSH_ENDPOINT: ${{ secrets.HETZNER_SSH_USER }}@${{ secrets.HETZNER_SSH_ADDRESS }}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: blacksmith-8vcpu-ubuntu-2404

    strategy:
      matrix:
        image:
          - name: backend
            target: production-blog
          - name: workload-controlplane
            target: production-workload-controlplane
          - name: workload-ingress
            target: production-workload-ingress
          - name: workload-orchestrator
            target: production-workload-orchestrator
          - name: workload-vmhost
            target: production-workload-vmhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run unit tests
        run: |
          go test ./... -v -race -cover

      - name: Build ${{ matrix.image.name }} image
        uses: ./.github/actions/docker-build
        with:
          context: .
          dockerfile: Dockerfile
          image-name: ${{ matrix.image.name }}
          target: ${{ matrix.image.target }}
          push: false
          container-registry: ${{ env.REGISTRY }}

  # vmhost's image is named by the fingerprint of its own code rather than by
  # the commit, and is deployed by that name: it is rebuilt and redeployed when
  # that code changes, and a deploy of the rest of the backend leaves the
  # running vmhost, and the terminals and connections it carries to microVMs,
  # alone (.github/actions/vmhost-fingerprint/fingerprint.sh).
  vmhost-fingerprint:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    outputs:
      tag: ${{ steps.fingerprint.outputs.tag }}
      image: ${{ steps.fingerprint.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true

      - name: Fingerprint vmhost
        id: fingerprint
        uses: ./.github/actions/vmhost-fingerprint
        with:
          container-registry: ${{ env.REGISTRY }}

  # the tests that boot real microVMs (-tags microvm), and the runtime
  # conformance suite against the microvm driver and a real vmhost. Firecracker
  # needs /dev/kvm, which GitHub's own Linux runners have, through nested
  # virtualization, and Blacksmith's may not.
  microvm:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true

      - name: Check for KVM
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::this runner has no /dev/kvm, so no microVM can boot on it"
            exit 1
          fi
          ls -l /dev/kvm

      - name: Install what vmhost runs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools e2fsprogs iptables

      - name: Boot microVMs
        run: make test-microvm

      - name: Run the conformance suite against a real vmhost
        run: make test-conformance-microvm

  build-and-push-images:
    runs-on: blacksmith-8vcpu-ubuntu-2404

    if: ${{ format('refs/heads/{0}', github.event.repository.default_branch) == github.ref }}

    permissions:
      packages: write
      contents: read

    needs:
      - ci
      - microvm
      - vmhost-fingerprint

    strategy:
      matrix:
        image:
          - name: backend
            target: production-blog
          - name: workload-controlplane
            target: production-workload-controlplane
          - name: workload-ingress
            target: production-workload-ingress
          - name: workload-orchestrator
            target: production-workload-orchestrator
          - name: workload-vmhost
            target: production-workload-vmhost
            fingerprinted: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # an image built from this code already is the one to deploy: building
      # it again would only move its tag to a new image, and with it vmhost
      - name: Look for ${{ matrix.image.name }} built from this code already
        id: built
        if: ${{ matrix.image.fingerprinted }}
        env:
          IMAGE: ${{ needs.vmhost-fingerprint.outputs.image }}
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin > /dev/null
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE is built already"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.image.name }} image
        if: ${{ steps.built.outputs.exists != 'true' }}
        uses: ./.github/actions/docker-build
        with:
          context: .
          dockerfile: Dockerfile
          image-name: ${{ matrix.image.name }}
          target: ${{ matrix.image.target }}
          tag: ${{ matrix.image.fingerprinted && needs.vmhost-fingerprint.outputs.tag || '' }}
          push: true
          container-registry: ${{ env.REGISTRY }}
          container-registry-username: ${{ github.actor }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    if: ${{ format('refs/heads/{0}', github.event.repository.default_branch) == github.ref }}

    permissions:
      packages: read
      contents: read

    needs:
      - build-and-push-images
      - vmhost-fingerprint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy services
        run: |
          # Setup ssh key
          echo '${{ secrets.HETZNER_SSH_PRIVATE_KEY }}' > ~/hetzner-key.pem
          chmod 400 ~/hetzner-key.pem

          mkdir -p ~/.ssh
          ssh-keyscan -H $HETZNER_SSH_ADDRESS >> ~/.ssh/known_hosts 2>/dev/null

          # Ensure remote directory exists
          ssh -q -i ~/hetzner-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $HETZNER_SSH_ENDPOINT << 'EOF' >/dev/null 2>&1
            mkdir -p /tmp/deployment_backend
            chown ${{ secrets.HETZNER_SSH_USER }}:${{ secrets.HETZNER_SSH_USER }} /tmp/deployment_backend

          EOF

          # Copy files
          scp -q -i ~/hetzner-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -r ./compose.*.yaml $HETZNER_SSH_ENDPOINT:/tmp/deployment_backend/ 2>/dev/null

          # Connect and deploy services. What the remote shell prints comes back
          # to the job log: a deploy that fails says why here rather than only in
          # a container nobody is looking at. The commands themselves are never
          # echoed -- no set -x -- so the exports below stay out of it.
          ssh -q -i ~/hetzner-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $HETZNER_SSH_ENDPOINT << 'EOF'
            # a failure surfaces through the exit status, which set -e propagates back through ssh
            set -e
            trap 'rm -rf /tmp/deployment_backend' EXIT

            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin > /dev/null

            export WEB_URL='${{ secrets.WEB_URL }}'
            export SERVICE_URL='${{ secrets.SERVICE_URL }}'

            export MONGO_USERNAME='${{ secrets.MONGO_USERNAME }}'
            export MONGO_PASSWORD='${{ secrets.MONGO_PASSWORD }}'

            export BACKEND_NATS_URL='${{ secrets.BACKEND_NATS_URL }}'
            export BACKEND_PRIVATE_KEY='${{ secrets.BACKEND_PRIVATE_KEY }}'

            export BACKEND_MONGO_HOST='mongodb'
            export BACKEND_MONGO_PORT='27017'
            export BACKEND_MONGO_SCHEME='mongodb'
            export BACKEND_MONGO_DATABASE_NAME='${{ secrets.BACKEND_MONGO_DATABASE_NAME }}'
            export BACKEND_MONGO_USERNAME='${{ secrets.MONGO_USERNAME }}'
            export BACKEND_MONGO_PASSWORD='${{ secrets.MONGO_PASSWORD }}'

            export BACKEND_MAIL_SMTP_PASSWORD='${{ secrets.BACKEND_MAIL_SMTP_PASSWORD }}'
            export BACKEND_MAIL_SMTP_HOST='${{ secrets.BACKEND_MAIL_SMTP_HOST }}'
            export BACKEND_MAIL_SMTP_FROM='${{ secrets.BACKEND_MAIL_SMTP_FROM }}'
            export BACKEND_MAIL_SMTP_USERNAME='${{ secrets.BACKEND_MAIL_SMTP_USERNAME }}'
            export BACKEND_MAIL_SMTP_PORT='${{ secrets.BACKEND_MAIL_SMTP_PORT }}'

            export BACKEND_S3_ENDPOINT='${{ secrets.BACKEND_S3_ENDPOINT }}'
            export BACKEND_S3_SECRET_KEY='${{ secrets.BACKEND_S3_SECRET_KEY }}'
            export BACKEND_S3_ACCESS_KEY='${{ secrets.BACKEND_S3_ACCESS_KEY }}'
            export BACKEND_S3_USE_SSL='${{ secrets.BACKEND_S3_USE_SSL }}'
            export BACKEND_S3_BUCKET_NAME='${{ secrets.BACKEND_S3_BUCKET_NAME }}'

            export BACKEND_DOCKER_HOST='${{ secrets.BACKEND_DOCKER_HOST }}'

            export BACKEND_WORKLOAD_CONTROLPLANE_URL='${{ secrets.BACKEND_WORKLOAD_CONTROLPLANE_URL }}'
            export BACKEND_WORKLOAD_INGRESS_DOMAIN='${{ secrets.BACKEND_WORKLOAD_INGRESS_DOMAIN }}'
            export BACKEND_WORKLOAD_ORCHESTRATOR_ADVERTISE_HOST='${{ secrets.BACKEND_WORKLOAD_ORCHESTRATOR_ADVERTISE_HOST }}'
            export BACKEND_WORKLOAD_TUNNEL_ADDRESSES='${{ secrets.BACKEND_WORKLOAD_TUNNEL_ADDRESSES }}'

            # each service's own certificate and the authority to check the
            # other end against, as the PEM itself. ca.key is deliberately not
            # here: nothing that runs needs it.
            export BACKEND_WORKLOAD_TUNNEL_CA_CERT='${{ secrets.BACKEND_WORKLOAD_TUNNEL_CA_CERT }}'
            export BACKEND_WORKLOAD_TUNNEL_SERVER_NAME='${{ secrets.BACKEND_WORKLOAD_TUNNEL_SERVER_NAME }}'
            export BACKEND_WORKLOAD_INGRESS_TUNNEL_CERT='${{ secrets.BACKEND_WORKLOAD_INGRESS_TUNNEL_CERT }}'
            export BACKEND_WORKLOAD_INGRESS_TUNNEL_KEY='${{ secrets.BACKEND_WORKLOAD_INGRESS_TUNNEL_KEY }}'
            export BACKEND_WORKLOAD_ORCHESTRATOR_01_TUNNEL_CERT='${{ secrets.BACKEND_WORKLOAD_ORCHESTRATOR_01_TUNNEL_CERT }}'
            export BACKEND_WORKLOAD_ORCHESTRATOR_01_TUNNEL_KEY='${{ secrets.BACKEND_WORKLOAD_ORCHESTRATOR_01_TUNNEL_KEY }}'
            export BACKEND_WORKLOAD_ORCHESTRATOR_02_TUNNEL_CERT='${{ secrets.BACKEND_WORKLOAD_ORCHESTRATOR_02_TUNNEL_CERT }}'
            export BACKEND_WORKLOAD_ORCHESTRATOR_02_TUNNEL_KEY='${{ secrets.BACKEND_WORKLOAD_ORCHESTRATOR_02_TUNNEL_KEY }}'
            export BACKEND_WORKLOAD_ORCHESTRATOR_03_TUNNEL_CERT='${{ secrets.BACKEND_WORKLOAD_ORCHESTRATOR_03_TUNNEL_CERT }}'
            export BACKEND_WORKLOAD_ORCHESTRATOR_03_TUNNEL_KEY='${{ secrets.BACKEND_WORKLOAD_ORCHESTRATOR_03_TUNNEL_KEY }}'

            # the ports arbitrary TCP arrives on, and what an orchestrator will connect
            # a stream to beyond the services it offers by name.
            export BACKEND_WORKLOAD_INGRESS_FORWARDS='${{ secrets.BACKEND_WORKLOAD_INGRESS_FORWARDS }}'
            export BACKEND_WORKLOAD_TUNNEL_ALLOWED_TARGETS='${{ secrets.BACKEND_WORKLOAD_TUNNEL_ALLOWED_TARGETS }}'
            # the public half of the key the blog signs access tokens with; the
            # orchestrators verify against it and never sign anything
            export BACKEND_PUBLIC_KEY='${{ secrets.BACKEND_PUBLIC_KEY }}'

            # the runtime classes users may ask for, the one a task gets when
            # it names none, and the one code-runner snippets run with: sysbox
            # for each when unset
            export BACKEND_WORKLOAD_RUNTIMES='${{ secrets.BACKEND_WORKLOAD_RUNTIMES }}'
            export BACKEND_WORKLOAD_DEFAULT_RUNTIME='${{ secrets.BACKEND_WORKLOAD_DEFAULT_RUNTIME }}'
            export BACKEND_WORKLOAD_CODE_RUNNER_RUNTIME='${{ secrets.BACKEND_WORKLOAD_CODE_RUNNER_RUNTIME }}'

            # vmhost, which runs the firecracker class's microVMs on this host.
            # Its memory budget, in bytes, is what says this host runs any:
            # without one, vmhost is not deployed and workload-orchestrator-01
            # offers sysbox alone. The rest are vmhost's own defaults when
            # unset (infrastructure/configs/vmhost.go).
            export BACKEND_WORKLOAD_VMHOST_MAX_MEMORY='${{ secrets.BACKEND_WORKLOAD_VMHOST_MAX_MEMORY }}'
            export BACKEND_WORKLOAD_VMHOST_MAX_VM_MEMORY='${{ secrets.BACKEND_WORKLOAD_VMHOST_MAX_VM_MEMORY }}'
            export BACKEND_WORKLOAD_VMHOST_MAX_VM_CPU='${{ secrets.BACKEND_WORKLOAD_VMHOST_MAX_VM_CPU }}'
            export BACKEND_WORKLOAD_VMHOST_CPU_OVERCOMMIT='${{ secrets.BACKEND_WORKLOAD_VMHOST_CPU_OVERCOMMIT }}'
            export BACKEND_WORKLOAD_VMHOST_DISK_RESERVE='${{ secrets.BACKEND_WORKLOAD_VMHOST_DISK_RESERVE }}'
            export BACKEND_WORKLOAD_VMHOST_DISK_OVERCOMMIT='${{ secrets.BACKEND_WORKLOAD_VMHOST_DISK_OVERCOMMIT }}'
            export BACKEND_WORKLOAD_VMHOST_IMAGE_CACHE_MAX='${{ secrets.BACKEND_WORKLOAD_VMHOST_IMAGE_CACHE_MAX }}'
            export BACKEND_WORKLOAD_VMHOST_NETWORK_POOL='${{ secrets.BACKEND_WORKLOAD_VMHOST_NETWORK_POOL }}'
            export BACKEND_WORKLOAD_VMHOST_ALLOWED_REGISTRIES='${{ secrets.BACKEND_WORKLOAD_VMHOST_ALLOWED_REGISTRIES }}'
            export BACKEND_WORKLOAD_VMHOST_MACHINE_FIRST_UID='${{ secrets.BACKEND_WORKLOAD_VMHOST_MACHINE_FIRST_UID }}'
            export BACKEND_WORKLOAD_VMHOST_MACHINE_UIDS='${{ secrets.BACKEND_WORKLOAD_VMHOST_MACHINE_UIDS }}'
            # a directory on the host holding a docker config.json with the
            # credentials for the registries task images come from, if any
            export BACKEND_WORKLOAD_VMHOST_REGISTRY_AUTH_DIR='${{ secrets.BACKEND_WORKLOAD_VMHOST_REGISTRY_AUTH_DIR }}'

            export APP_IMAGE='${{ secrets.APP_IMAGE }}'
            export WORKLOAD_CONTROLPLANE_IMAGE='${{ secrets.WORKLOAD_CONTROLPLANE_IMAGE }}'
            export WORKLOAD_INGRESS_IMAGE='${{ secrets.WORKLOAD_INGRESS_IMAGE }}'
            export WORKLOAD_ORCHESTRATOR_IMAGE='${{ secrets.WORKLOAD_ORCHESTRATOR_IMAGE }}'
            # by the fingerprint of vmhost's own code, never by latest: the
            # running vmhost is replaced when that changes, and only then
            export WORKLOAD_VMHOST_IMAGE='${{ needs.vmhost-fingerprint.outputs.image }}'

            export OTEL_EXPORTER_OTLP_INSECURE='${{ secrets.OTEL_EXPORTER_OTLP_INSECURE }}'
            export OTEL_EXPORTER_OTLP_PROTOCOL='${{ secrets.OTEL_EXPORTER_OTLP_PROTOCOL }}'
            export OTEL_RESOURCE_ATTRIBUTES='${{ secrets.OTEL_RESOURCE_ATTRIBUTES }}'
            export OTEL_EXPORTER_OTLP_ENDPOINT='${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}'
            export OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT='${{ secrets.OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT }}'

            # Run Docker Compose
            cd /tmp/deployment_backend/

            # --wait holds the deploy until every replica passes the healthcheck
            # defined in the compose file, so a version that cannot serve traffic
            # fails the job instead of being reported as deployed. A service that
            # never gets there says so in its own words: what it printed before
            # it gave up is the only thing that explains why.
            # Anything after the project's name is passed on to up as it is.
            deploy() {
                local file="$1" project="$2"
                shift 2

                if docker compose -f "$file" --project-name "$project" up --detach --wait --wait-timeout 180 "$@"; then
                    return 0
                fi

                echo "::error::$project did not come up; what it said follows"
                docker compose -f "$file" --project-name "$project" ps -a
                docker compose -f "$file" --project-name "$project" logs --tail 50 --no-color

                return 1
            }

            # vmhost runs the firecracker class's microVMs on this host, for
            # workload-orchestrator-01, which is why it comes before the
            # orchestrators. Its microVMs are units of the host's systemd and
            # outlive it, so replacing it leaves them running; it is replaced
            # only when its image changes, which is when its code does.
            deploy_vmhost() {
                # the host's own preflight, which Tarhche/infrastructure keeps on
                # the host (vmhost-host): what it finds not ready would stop vmhost
                # or cut its microVMs off, live-restore being off among them
                if ! docker container inspect vmhost-host-preflight-1 > /dev/null 2>&1; then
                    echo "::error::this host was never prepared for vmhost: deploy Tarhche/infrastructure (vmhost-host) first"
                    return 1
                fi
                if ! docker start --attach vmhost-host-preflight-1; then
                    echo "::error::this host is not ready for vmhost: the preflight above says what to fix"
                    return 1
                fi

                # the holder of the microVMs' network namespace: made once, and
                # never recreated, which would cut every running microVM off its
                # network (compose.workload-vmhost.yaml says why and how)
                if ! docker compose -f compose.workload-vmhost.yaml --project-name workload-vmhost up --detach --no-recreate workload-vmnet; then
                    echo "::error::workload-vmnet, the holder of the microVMs' network, did not come up"
                    return 1
                fi

                # pulled only when missing: the tag names the code, so an image
                # already here is the right one, and vmhost stays as it is
                deploy compose.workload-vmhost.yaml workload-vmhost --pull missing --no-deps workload-vmhost
            }

            deploy compose.app.yaml app --pull always
            deploy compose.workload-controlplane.yaml workload-controlplane --pull always
            deploy compose.workload-ingress.yaml workload-ingress --pull always

            # a failed vmhost deploy is reported once the orchestrators are
            # deployed too: they do not depend on this deploy, only on vmhost
            # running, which the last one still may be
            vmhost_failed=0
            if [ -n "$BACKEND_WORKLOAD_VMHOST_MAX_MEMORY" ]; then
                deploy_vmhost || vmhost_failed=1
            else
                echo "this host has no memory budget for microVMs (BACKEND_WORKLOAD_VMHOST_MAX_MEMORY), so vmhost is not deployed and workload-orchestrator-01 offers sysbox alone"
                export BACKEND_WORKLOAD_ORCHESTRATOR_01_RUNTIMES="sysbox=container@${BACKEND_DOCKER_HOST}"
            fi

            deploy compose.workload-orchestrator-01.yaml workload-orchestrator-01 --pull always
            deploy compose.workload-orchestrator-02.yaml workload-orchestrator-02 --pull always
            deploy compose.workload-orchestrator-03.yaml workload-orchestrator-03 --pull always

            if [ "$vmhost_failed" -ne 0 ]; then
                echo "::error::vmhost was not deployed; see above"
                exit 1
            fi
          EOF
