services:
  runner-ingress:
    image: ${RUNNER_INGRESS_IMAGE}
    security_opt:
      - no-new-privileges:true
    networks:
      - runner_manager
      - mongodb
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      mode: replicated
      # one replica per address: a worker's connections land on whichever
      # replica it dialled, and one name in front of several replicas hands
      # each connection to a different one. Several ingresses are had by
      # running several of these with an address each and naming them all in
      # RUNNER_TUNNEL_ADDRESSES, which is what a worker keeps a pool per.
      replicas: 1
      endpoint_mode: vip
      update_config:
        parallelism: 1
        order: start-first
        monitor: 90s
        delay: 5s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
        monitor: 90s
        delay: 5s
        failure_action: pause
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.20'
          memory: 100M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      RUNNER_INGRESS_DOMAIN: ${BACKEND_RUNNER_INGRESS_DOMAIN}
      MONGO_SCHEME: ${BACKEND_MONGO_SCHEME}
      MONGO_USERNAME: ${BACKEND_MONGO_USERNAME}
      MONGO_PASSWORD: ${BACKEND_MONGO_PASSWORD}
      MONGO_HOST: ${BACKEND_MONGO_HOST}
      MONGO_PORT: ${BACKEND_MONGO_PORT}
      MONGO_DATABASE_NAME: ${BACKEND_MONGO_DATABASE_NAME}
      # the authority and this ingress's own certificate. The authority's
      # private key is deliberately not here: nothing that runs needs it.
      RUNNER_TUNNEL_CA_CERT: ${BACKEND_RUNNER_TUNNEL_CA_CERT:-/certs/ca/ca.crt}
      RUNNER_TUNNEL_CERT: ${BACKEND_RUNNER_TUNNEL_CERT:-/certs/tls.crt}
      RUNNER_TUNNEL_KEY: ${BACKEND_RUNNER_TUNNEL_KEY:-/certs/tls.key}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}
      # ports arbitrary TCP arrives on, as listen=worker:target. Nothing is
      # forwarded unless it is named here.
      RUNNER_INGRESS_FORWARDS: ${BACKEND_RUNNER_INGRESS_FORWARDS:-}

networks:
  runner_manager:
    name: runner_manager
    external: true
  mongodb:
    name: mongodb
    external: true
  monitoring:
    name: monitoring
    external: true
