basePath: /api
definitions:
  approveauthorization.Request:
    properties:
      approved:
        description: |-
          Approved is the answer. A request that is not approved is refused, and
          the application is told so at the address it registered.
        type: boolean
      request:
        description: |-
          RequestToken is the authorization request as the authorization endpoint
          signed it.
        type: string
    type: object
  approveauthorization.Response:
    properties:
      redirect_to:
        type: string
    type: object
  bookmarkExists.Request:
    properties:
      language_code:
        type: string
      object_type:
        type: string
      object_uuid:
        type: string
    type: object
  bookmarkExists.Response:
    properties:
      errors:
        $ref: '#/definitions/domain.ValidationErrors'
      exist:
        type: boolean
    type: object
  changepassword.Request:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  connectNetwork.Request:
    properties:
      aliases:
        description: |-
          Aliases are the names its neighbours on that network reach it by, beside
          its own.
        items:
          type: string
        type: array
      network:
        description: Network is the network's id or its name.
        type: string
    type: object
  createContainer.Mount:
    properties:
      read_only:
        type: boolean
      source:
        type: string
      target:
        type: string
      type:
        type: string
    type: object
  createContainer.PortBinding:
    properties:
      container_port:
        type: integer
      host_port:
        type: integer
      protocol:
        description: Protocol is tcp or udp; empty is tcp.
        type: string
    type: object
  createContainer.Request:
    properties:
      command:
        items:
          type: string
        type: array
      cpus:
        description: CPUs is in cores and Memory in bytes; zero is no limit beyond
          the VM's.
        type: number
      entrypoint:
        items:
          type: string
        type: array
      env:
        description: Env is the environment, each as KEY=value.
        items:
          type: string
        type: array
      image:
        description: Image is pulled first when the VM does not hold it.
        type: string
      memory:
        type: integer
      mounts:
        items:
          $ref: '#/definitions/createContainer.Mount'
        type: array
      name:
        description: Name is docker's name for it; empty lets docker pick one.
        type: string
      networks:
        description: |-
          Networks are the VM's docker networks to attach it to, beside the
          default one.
        items:
          type: string
        type: array
      ports:
        description: |-
          Ports publish container ports on the VM. A VM port the VM also exposes
          through the ingress is reachable from outside; any other is reachable
          only from inside the VM.
        items:
          $ref: '#/definitions/createContainer.PortBinding'
        type: array
      restart_policy:
        description: RestartPolicy is no, always, unless-stopped or on-failure.
        type: string
      vm:
        $ref: '#/definitions/input.NewDockerVM'
      vm_uuid:
        type: string
      working_dir:
        type: string
    type: object
  createContainer.Response:
    properties:
      container:
        $ref: '#/definitions/presenter.Container'
      errors:
        $ref: '#/definitions/domain.ValidationErrors'
      vm:
        allOf:
        - $ref: '#/definitions/presenter.ChosenVM'
        description: |-
          VM is the Docker VM the container went into, and whether it was made
          for it.
    type: object
  createMessage.Request:
    properties:
      body:
        type: string
      email:
        type: string
      phone:
        type: string
      subject:
        type: string
    type: object
  createNetwork.Request:
    properties:
      driver:
        description: |-
          Driver is bridge, which is also what empty is: a VM is a single docker
          host, and no other driver has anything to join there.
        type: string
      internal:
        description: Internal keeps the containers on it from reaching anything outside
          it.
        type: boolean
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
    type: object
  createSnapshot.Request:
    properties:
      name:
        type: string
    type: object
  createStack.Request:
    properties:
      compose:
        description: |-
          Compose is the YAML, as it would be handed to docker compose. What it
          calls its project is ignored: the stack's slug is the project.
        type: string
      name:
        type: string
      vm:
        $ref: '#/definitions/input.NewDockerVM'
      vm_uuid:
        type: string
    type: object
  createStack.Response:
    properties:
      errors:
        $ref: '#/definitions/domain.ValidationErrors'
      stack:
        $ref: '#/definitions/presenter.Stack'
      vm:
        allOf:
        - $ref: '#/definitions/presenter.ChosenVM'
        description: |-
          VM is the Docker VM the stack went into, and whether it was made for
          it.
    type: object
  createVM.Request:
    properties:
      image:
        description: |-
          Image is the OCI reference a machine boots from; empty takes its
          kind's default, and a Docker VM is always the workload's own image.
        type: string
      kind:
        description: |-
          Kind is machine, an OS image somebody opens a terminal in, or docker,
          the image containers and stacks are run in.
        type: string
      lifetime_seconds:
        description: |-
          LifetimeSeconds is how long the VM is kept before it is deleted, and
          zero keeps it until somebody deletes it.
        type: integer
      name:
        type: string
      network:
        $ref: '#/definitions/input.Network'
      persistent_disk:
        description: |-
          PersistentDisk keeps what is written to the disk across a stop and a
          start; without it the disk is as the image left it on every start.
        type: boolean
      ports:
        description: Ports are the guest ports the ingress serves, while ingress allows
          it.
        items:
          type: integer
        type: array
      resources:
        $ref: '#/definitions/input.Resources'
      snapshot_uuid:
        description: |-
          SnapshotUUID makes the VM from one of the caller's snapshots: its kind
          and image are the snapshot's, and its disk the larger of the one asked
          for and the snapshot's.
        type: string
    type: object
  createVolume.Request:
    properties:
      driver:
        description: |-
          Driver is local, which is also what empty is: a volume lives on the
          VM's own disk.
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
    type: object
  createarticle.Request:
    properties:
      body:
        type: string
      correlation_uuid:
        type: string
      cover:
        type: string
      excerpt:
        type: string
      language_code:
