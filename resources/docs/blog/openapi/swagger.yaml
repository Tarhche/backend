        type: string
      driver:
        type: string
      in_use:
        description: InUse says a container mounts it.
        type: boolean
      labels:
        additionalProperties:
          type: string
        type: object
      mountpoint:
        type: string
      name:
        type: string
    type: object
  pullImage.Request:
    properties:
      reference:
        description: Reference is the image, as name[:tag] or name@digest.
        type: string
    type: object
  refresh.Request:
    properties:
      token:
        type: string
    type: object
  refresh.Response:
    properties:
      access_token:
        type: string
      errors:
        $ref: '#/definitions/domain.ValidationErrors'
      refresh_token:
        type: string
    type: object
  register.Request:
    properties:
      identity:
        type: string
    type: object
  registerclient.Request:
    properties:
      client_name:
        type: string
      client_uri:
        type: string
      grant_types:
        items:
          type: string
        type: array
      redirect_uris:
        items:
          type: string
        type: array
      response_types:
        items:
          type: string
        type: array
      scope:
        type: string
      token_endpoint_auth_method:
        type: string
    type: object
  registerclient.Response:
    properties:
      client_id:
        type: string
      client_id_issued_at:
        type: integer
      client_name:
        type: string
      client_secret:
        description: |-
          ClientSecret is handed over once, here, and is never readable again. It
          is absent for a public client, which has none.
        type: string
      client_secret_expires_at:
        description: |-
          ClientSecretExpiresAt is zero for a secret that does not expire, and
          [RFC 7591] asks for it whenever a secret was issued, zero included.

          [RFC 7591]: https://www.rfc-editor.org/rfc/rfc7591
        type: integer
      client_uri:
        type: string
      grant_types:
        items:
          type: string
        type: array
      redirect_uris:
        items:
          type: string
        type: array
      response_types:
        items:
          type: string
        type: array
      scope:
        type: string
      token_endpoint_auth_method:
        type: string
    type: object
  renameSnapshot.Request:
    properties:
      name:
        type: string
    type: object
  resetpassword.Request:
    properties:
      password:
        type: string
      token:
        type: string
    type: object
  restoreVM.Request:
    properties:
