      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: OAuth protected resource metadata
      tags:
      - oauth
  /articles:
    get:
      consumes:
      - application/json
      description: return a page of the most recent published articles
      parameters:
