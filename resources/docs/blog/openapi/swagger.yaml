  getStack.Response:
    properties:
      compose:
        description: |-
          Compose is the YAML as it was given. A listing leaves it out: it is
          as long as somebody wrote it, and a listing is read to choose one.
        type: string
      containers:
        items:
          $ref: '#/definitions/presenter.Container'
        type: array
      created_at:
        type: string
      expected_state:
        type: string
      name:
        type: string
      note:
        description: |-
          Note says why there are no containers when it is not that the stack has
          none: NoteVMNotRunning.
        type: string
      output:
        description: Output is the tail of what the last compose command printed.
        type: string
      owner:
        $ref: '#/definitions/presenter.Owner'
      owner_uuid:
        type: string
      reason:
        type: string
      slug:
        description: |-
          Slug is the compose project's name inside the VM, which its containers
          carry as their stack.
        type: string
      state:
        description: |-
          State is what the last compose command left it as; ExpectedState is
          what it was asked to be, running or stopped.
        type: string
      updated_at:
        type: string
      uuid:
        type: string
      vm_name:
        type: string
      vm_uuid:
        description: |-
          VMUUID is the Docker VM it is deployed into, and VMName what that VM is
          called now.
        type: string
    type: object
  getStacks.Response:
    properties:
