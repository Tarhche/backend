          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Forgot password
      tags:
      - auth
  /auth/password/reset:
    post:
      consumes:
      - application/json
