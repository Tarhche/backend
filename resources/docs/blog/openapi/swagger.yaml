        as {"id", "subject", "payload"} and receives replies as {"request_id", "payload"};
        the subject must be one the server consumes.
      responses:
        "101":
          description: switching protocols
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "503":
          description: the service is shutting down
          schema:
            type: string
      summary: Websocket endpoint
      tags:
      - websocket
