      parameters:
      - description: The application asking
        in: query
        name: client_id
        required: true
        type: string
      - description: Where it is answered; one it registered
        in: query
        name: redirect_uri
        required: true
        type: string
      - description: code
        in: query
        name: response_type
        required: true
        type: string
      - description: The proof-key challenge
        in: query
        name: code_challenge
        required: true
        type: string
      - description: S256
        in: query
        name: code_challenge_method
        required: true
        type: string
      - description: Handed back untouched
        in: query
        name: state
        type: string
      - description: mcp
        in: query
        name: scope
        type: string
      - description: What the application wants to reach
        in: query
        name: resource
        type: string
      produces:
      - application/json
      responses:
