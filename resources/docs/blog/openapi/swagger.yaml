  presenter.VM:
    properties:
      created_at:
        type: string
      expected_state:
        type: string
      expires_at:
        type: string
      image:
        type: string
      kind:
        type: string
      lifetime_seconds:
        description: |-
          LifetimeSeconds is how long the VM is kept, and zero is until it is
          deleted. ExpiresAt is when one with a lifetime goes.
        type: integer
      name:
        type: string
      network:
        $ref: '#/definitions/presenter.Network'
      node_name:
        type: string
      owner:
        $ref: '#/definitions/presenter.Owner'
      owner_uuid:
        type: string
      persistent_disk:
        type: boolean
      ports:
        description: Ports are the guest ports the ingress serves, sorted.
        items:
          type: integer
        type: array
      reason:
        description: Reason is why it failed, or what is pending, when the workload
          can say.
        type: string
      resources:
        $ref: '#/definitions/presenter.Resources'
      slug:
        description: Slug is the name its ports are served under.
        type: string
      started_at:
        type: string
      state:
        description: |-
          State is what the VM is doing; ExpectedState is what it was asked to be
          doing. They differ while the workload is closing the gap.
        type: string
      stats:
        allOf:
        - $ref: '#/definitions/presenter.Stats'
        description: |-
          Stats is the last sample its node reported, and is left out until there
          is one.
      updated_at:
        type: string
      urls:
        description: URLs are where its ports are served, while its ingress allows
          it.
        items:
          $ref: '#/definitions/presenter.URL'
        type: array
      uuid:
        type: string
    type: object
  presenter.VMContainer:
    properties:
      command:
        type: string
      created_at:
        type: string
      id:
        type: string
      image:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      mounts:
        items:
          $ref: '#/definitions/presenter.Mount'
        type: array
      name:
        type: string
      networks:
        items:
          type: string
        type: array
      ports:
        items:
          $ref: '#/definitions/presenter.PortBinding'
        type: array
      restart_policy:
        type: string
      service:
        type: string
      stack:
        description: |-
          Stack and Service are the compose project and service it belongs to,
          when a stack deployed it. The project is the stack's slug, and
          StackUUID is the stack's uuid when the request could see that stack.
        type: string
      stack_uuid:
        type: string
      state:
        description: |-
          State is docker's: created, running, paused, restarting, removing,
          exited or dead. Status is the sentence docker puts it in.
        type: string
      status:
        type: string
      vm_name:
        type: string
      vm_uuid:
        type: string
    type: object
  presenter.VMLogLine:
    properties:
      at:
        type: string
      line:
        type: string
      source:
        type: string
    type: object
  presenter.Volume:
    properties:
