  /oauth/authorization:
    get:
      description: what the application asking is called and what it is asking for
      parameters:
      - description: The authorization request, as the authorization endpoint signed
          it
        in: query
        name: request
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/describeauthorization.Response'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Describe a pending authorization
      tags:
      - oauth
    post:
      consumes:
      - application/json
      description: approves or refuses an application, and says where to send the
        browser next
      parameters:
      - description: The request being answered
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/approveauthorization.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/approveauthorization.Response'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Answer a pending authorization
      tags:
      - oauth
  /oauth/authorize:
    get:
      description: reads what an application is asking for and sends the browser on
        to the page that asks the person about it
      parameters:
      - description: The application asking
        in: query
        name: client_id
        required: true
        type: string
      - description: Where it is answered; one it registered
        in: query
        name: redirect_uri
        required: true
        type: string
      - description: code
        in: query
        name: response_type
        required: true
        type: string
      - description: The proof-key challenge
        in: query
        name: code_challenge
        required: true
        type: string
      - description: S256
        in: query
        name: code_challenge_method
        required: true
        type: string
      - description: Handed back untouched
        in: query
        name: state
        type: string
      - description: mcp
        in: query
        name: scope
        type: string
      - description: What the application wants to reach
        in: query
        name: resource
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Authorization endpoint
      tags:
      - oauth
  /oauth/register:
    post:
      consumes:
      - application/json
      description: registers an OAuth client, which is how an MCP client introduces
        itself before anybody approves it
      parameters:
      - description: Client metadata
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/registerclient.Request'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/registerclient.Response'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Register an application
      tags:
      - oauth
  /oauth/token:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: exchanges an authorization code for a session, or renews one
      parameters:
      - description: authorization_code or refresh_token
        in: formData
        name: grant_type
        required: true
        type: string
      - description: The code the application was handed
        in: formData
        name: code
        type: string
      - description: What the challenge was built from
        in: formData
        name: code_verifier
        type: string
      - description: The address the code was given for
        in: formData
        name: redirect_uri
        type: string
      - description: The refresh token being renewed
        in: formData
        name: refresh_token
        type: string
      - description: The application asking
        in: formData
        name: client_id
        type: string
      - description: Its secret, when it has one
        in: formData
        name: client_secret
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/exchangecode.Response'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Token endpoint
      tags:
      - oauth
  /ws:
    get:
      description: upgrades the connection to a websocket. the client sends requests
        as {"id", "subject", "payload"} and receives replies as {"request_id", "payload"};
        the subject must be one the server consumes.
      responses:
        "101":
          description: switching protocols
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "503":
          description: the service is shutting down
          schema:
            type: string
      summary: Websocket endpoint
      tags:
      - websocket
schemes:
- http
- https
swagger: "2.0"
