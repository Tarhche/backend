# What stands in front of the nodes.
#
# Every node answers for every container — the one holding it serves it, and
# the others pass the request on — so this only has to reach any of them.
# "runner-worker" is the nodes' own name, and docker answers it with all of
# them, so a node that is started is behind this without being named here.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name ~^.+$;

    location / {
        set $nodes runner-worker;
        proxy_pass http://$nodes:8090;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # a container's own traffic: an upload or a websocket rather than a
        # request that finishes.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
