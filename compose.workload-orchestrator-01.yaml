services:
  workload-orchestrator-01:
    image: ${WORKLOAD_ORCHESTRATOR_IMAGE}
    security_opt:
      - no-new-privileges:true
    networks:
      - nats
      - docker
      # for dialling the ingress, which is the whole of what this is for. An
      # orchestrator has no business reaching the control plane or another orchestrator.
      - workload_ingress
      # the microsandbox service's API and its tasks' ports, which only matter
      # while this orchestrator runs its tasks as microVMs
      - workload_microsandbox
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: vip
      update_config:
        parallelism: 1
        order: start-first
        monitor: 90s
        delay: 5s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
        monitor: 90s
        delay: 5s
        failure_action: pause
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.10'
          memory: 50M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      WORKLOAD_ORCHESTRATOR_NAME: workload-orchestrator-01
      # the host the containers' published ports land on, which is the docker
      # daemon's own rather than this service's. Where this orchestrator's API
      # answers needs no saying: it is this service's name and port.
      WORKLOAD_ORCHESTRATOR_ADVERTISE_HOST: ${BACKEND_WORKLOAD_ORCHESTRATOR_ADVERTISE_HOST}
      # every ingress this orchestrator opens connections to, separated by commas
      WORKLOAD_TUNNEL_ADDRESSES: ${BACKEND_WORKLOAD_TUNNEL_ADDRESSES:-workload-ingress:81}
      # this orchestrator's own certificate, as the PEM itself, and the authority to
      # check the ingress against. Its private key belongs to it alone.
      WORKLOAD_TUNNEL_CA_CERT: ${BACKEND_WORKLOAD_TUNNEL_CA_CERT}
      WORKLOAD_TUNNEL_CERT: ${BACKEND_WORKLOAD_ORCHESTRATOR_01_TUNNEL_CERT}
      WORKLOAD_TUNNEL_KEY: ${BACKEND_WORKLOAD_ORCHESTRATOR_01_TUNNEL_KEY}
      WORKLOAD_TUNNEL_SERVER_NAME: ${BACKEND_WORKLOAD_TUNNEL_SERVER_NAME:-workload-ingress}
      # the public half of the key the blog signs access tokens with
      PUBLIC_KEY: ${BACKEND_PUBLIC_KEY}
      NATS_URL: ${BACKEND_NATS_URL}
      DOCKER_HOST: ${BACKEND_DOCKER_HOST}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}
      # addresses a stream may be connected to beyond the services this orchestrator
      # offers by name. Empty allows none.
      WORKLOAD_TUNNEL_ALLOWED_TARGETS: ${BACKEND_WORKLOAD_TUNNEL_ALLOWED_TARGETS:-}
      # what this orchestrator runs its tasks as: sysbox, containers on the docker
      # daemon, or microsandbox, microVMs in workload-microsandbox. One setting
      # switches them all and this orchestrator's own overrides it, so they can be
      # switched one after another. Drain it first: it stops seeing what the
      # other one runs.
      WORKLOAD_ORCHESTRATOR_RUNTIME: ${BACKEND_WORKLOAD_ORCHESTRATOR_01_RUNTIME:-${BACKEND_WORKLOAD_ORCHESTRATOR_RUNTIME:-sysbox}}
      # the microsandbox service, in microsandbox mode, whose host is also where
      # the tasks' ports are reached. Ignored in sysbox mode.
      WORKLOAD_MICROSANDBOX_URL: ${BACKEND_WORKLOAD_MICROSANDBOX_URL:-https://workload-microsandbox:8443}

networks:
  nats:
    name: nats
    external: true
  workload_ingress:
    name: workload_ingress
    external: true
  docker:
    name: docker
    external: true
  workload_microsandbox:
    name: workload_microsandbox
    external: true
  monitoring:
    name: monitoring
    external: true
