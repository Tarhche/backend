services:
  runner-worker-02:
    image: ${RUNNER_WORKER_IMAGE}
    security_opt:
      - no-new-privileges:true
    networks:
      - nats
      - docker
      - runner_manager
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: vip
      update_config:
        parallelism: 1
        order: start-first
        monitor: 90s
        delay: 5s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
        monitor: 90s
        delay: 5s
        failure_action: pause
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.10'
          memory: 50M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      RUNNER_WORKER_NAME: runner-worker-02
      # the host the containers' published ports land on, and where this
      # worker's own API is reachable from the manager.
      RUNNER_WORKER_ADVERTISE_HOST: ${BACKEND_RUNNER_WORKER_ADVERTISE_HOST}
      RUNNER_WORKER_API_ADDRESS: runner-worker-02:80
      NATS_URL: ${BACKEND_NATS_URL}
      DOCKER_HOST: ${BACKEND_DOCKER_HOST}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}

networks:
  nats:
    name: nats
    external: true
  runner_manager:
    name: runner_manager
    external: true
  docker:
    name: docker
    external: true
  monitoring:
    name: monitoring
    external: true
