# app placement
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 120s
  stop_grace_period: 10s
  depends_on:
    - mongodb
    - nats
    - rustfs
    - rustfs_configure
    - docker
    - mailserver
    - grafana
  volumes:
    - ./:/opt/app
    # each service's own build output. The services share the source, and air
    # builds each into tmp/main: in one directory, one's build hits another's
    # running binary ("text file busy") and that service does not start.
    - /opt/app/tmp

services:
  app:
    <<: *app
    build:
      target: develop-blog
    ports:
      - "8000:80"
    environment:
      WEB_URL: ${WEB_URL}
      SERVICE_URL: ${SERVICE_URL}
      PRIVATE_KEY: ${PRIVATE_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_USE_SSL: ${S3_USE_SSL}
      MONGO_SCHEME: ${MONGO_SCHEME}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DATABASE_NAME: ${MONGO_DATABASE_NAME}
      MAIL_SMTP_FROM: ${MAIL_SMTP_FROM}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT}
      NATS_URL: ${NATS_URL}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}
      WORKLOAD_CONTROLPLANE_URL: ${WORKLOAD_CONTROLPLANE_URL}
      WORKLOAD_INGRESS_DOMAIN: ${WORKLOAD_PUBLIC_INGRESS_DOMAIN}
      WORKLOAD_CODE_RUNNER_RUNTIME: ${WORKLOAD_CODE_RUNNER_RUNTIME:-sysbox}

  workload-controlplane:
    <<: *app
    build:
      target: develop-workload-controlplane
    ports:
      - "8020:80"
    environment:
      WORKLOAD_RUNTIMES: ${WORKLOAD_RUNTIMES:-sysbox}
      WORKLOAD_DEFAULT_RUNTIME: ${WORKLOAD_DEFAULT_RUNTIME:-sysbox}
      MONGO_SCHEME: ${MONGO_SCHEME}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DATABASE_NAME: ${MONGO_DATABASE_NAME}
      NATS_URL: ${NATS_URL}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}

  workload-ingress:
    <<: *app
    build:
      target: develop-workload-ingress
    ports:
      # the ingress's own routes and, by hostname, the containers' exposed ports
      - "8030:80"
      # a forwarded port, carrying arbitrary TCP to an orchestrator through the tunnel
      - "8031:8031"
    environment:
      WORKLOAD_INGRESS_DOMAIN: ${WORKLOAD_INGRESS_DOMAIN}
      MONGO_SCHEME: ${MONGO_SCHEME}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DATABASE_NAME: ${MONGO_DATABASE_NAME}
      WORKLOAD_TUNNEL_CA_CERT: ${WORKLOAD_TUNNEL_CA_CERT}
      WORKLOAD_TUNNEL_CERT: ${WORKLOAD_INGRESS_TUNNEL_CERT}
      WORKLOAD_TUNNEL_KEY: ${WORKLOAD_INGRESS_TUNNEL_KEY}
      WORKLOAD_INGRESS_FORWARDS: ${WORKLOAD_INGRESS_FORWARDS}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}

  workload-orchestrator-01:
    <<: *app
    build:
      target: develop-workload-orchestrator
    ports:
      - "8040:80"
    volumes:
      - ./:/opt/app
      - /opt/app/tmp
      # where vmhost takes requests, when it runs (profile microvm). This node
      # does not wait for it: while vmhost is away, firecracker is offered
      # unhealthy until it answers, and sysbox runs here all the same.
      - workload-vmhost-run:/run/workload-vmhost:ro
    environment:
      WORKLOAD_ORCHESTRATOR_NAME: workload-orchestrator-01
      # the classes this node offers, as class=kind@endpoint. Empty is sysbox
      # alone on the docker daemon below; make up-microvm adds firecracker.
      WORKLOAD_ORCHESTRATOR_RUNTIMES: ${WORKLOAD_ORCHESTRATOR_01_RUNTIMES:-}
      # the containers' ports are published on the docker daemon's own host,
      # which is the dind service rather than this one.
      WORKLOAD_ORCHESTRATOR_ADVERTISE_HOST: ${WORKLOAD_ORCHESTRATOR_ADVERTISE_HOST}
      WORKLOAD_TUNNEL_ADDRESSES: ${WORKLOAD_TUNNEL_ADDRESSES}
      WORKLOAD_TUNNEL_CA_CERT: ${WORKLOAD_TUNNEL_CA_CERT}
      WORKLOAD_TUNNEL_CERT: ${WORKLOAD_ORCHESTRATOR_01_TUNNEL_CERT}
      WORKLOAD_TUNNEL_KEY: ${WORKLOAD_ORCHESTRATOR_01_TUNNEL_KEY}
      WORKLOAD_TUNNEL_SERVER_NAME: ${WORKLOAD_TUNNEL_SERVER_NAME}
      PUBLIC_KEY: ${PUBLIC_KEY}
      WORKLOAD_TUNNEL_ALLOWED_TARGETS: ${WORKLOAD_TUNNEL_ALLOWED_TARGETS}
      NATS_URL: ${NATS_URL}
      DOCKER_HOST: ${BACKEND_DOCKER_HOST}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}
  workload-orchestrator-02:
    <<: *app
    build:
      target: develop-workload-orchestrator
    ports:
      - "8041:80"
    environment:
      WORKLOAD_ORCHESTRATOR_NAME: workload-orchestrator-02
      # the containers' ports are published on the docker daemon's own host,
      # which is the dind service rather than this one.
      WORKLOAD_ORCHESTRATOR_ADVERTISE_HOST: ${WORKLOAD_ORCHESTRATOR_ADVERTISE_HOST}
      WORKLOAD_TUNNEL_ADDRESSES: ${WORKLOAD_TUNNEL_ADDRESSES}
      WORKLOAD_TUNNEL_CA_CERT: ${WORKLOAD_TUNNEL_CA_CERT}
      WORKLOAD_TUNNEL_CERT: ${WORKLOAD_ORCHESTRATOR_02_TUNNEL_CERT}
      WORKLOAD_TUNNEL_KEY: ${WORKLOAD_ORCHESTRATOR_02_TUNNEL_KEY}
      WORKLOAD_TUNNEL_SERVER_NAME: ${WORKLOAD_TUNNEL_SERVER_NAME}
      PUBLIC_KEY: ${PUBLIC_KEY}
      WORKLOAD_TUNNEL_ALLOWED_TARGETS: ${WORKLOAD_TUNNEL_ALLOWED_TARGETS}
      NATS_URL: ${NATS_URL}
      DOCKER_HOST: ${BACKEND_DOCKER_HOST}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}
  workload-orchestrator-03:
    <<: *app
    build:
      target: develop-workload-orchestrator
    ports:
      - "8042:80"
    environment:
      WORKLOAD_ORCHESTRATOR_NAME: workload-orchestrator-03
      # the containers' ports are published on the docker daemon's own host,
      # which is the dind service rather than this one.
      WORKLOAD_ORCHESTRATOR_ADVERTISE_HOST: ${WORKLOAD_ORCHESTRATOR_ADVERTISE_HOST}
      WORKLOAD_TUNNEL_ADDRESSES: ${WORKLOAD_TUNNEL_ADDRESSES}
      WORKLOAD_TUNNEL_CA_CERT: ${WORKLOAD_TUNNEL_CA_CERT}
      WORKLOAD_TUNNEL_CERT: ${WORKLOAD_ORCHESTRATOR_03_TUNNEL_CERT}
      WORKLOAD_TUNNEL_KEY: ${WORKLOAD_ORCHESTRATOR_03_TUNNEL_KEY}
      WORKLOAD_TUNNEL_SERVER_NAME: ${WORKLOAD_TUNNEL_SERVER_NAME}
      PUBLIC_KEY: ${PUBLIC_KEY}
      WORKLOAD_TUNNEL_ALLOWED_TARGETS: ${WORKLOAD_TUNNEL_ALLOWED_TARGETS}
      NATS_URL: ${NATS_URL}
      DOCKER_HOST: ${BACKEND_DOCKER_HOST}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}

  # The firecracker runtime class: vmhost and the holder of its microVMs'
  # network namespace, as compose.workload-vmhost.yaml runs them in production.
  # They need Linux with /dev/kvm and systemd, so they only run with the
  # microvm profile, in the Lima VM (lima/workload.yaml):
  #
  #   make lima-up && make lima-shell
  #   make up-microvm
  #
  # Without the profile, make up is what it always was: docker alone.
  workload-vmnet:
    image: registry.k8s.io/pause:3.10.1@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
    profiles: ["microvm"]
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    # the namespace's own, never the host's: vmhost forwards the microVMs'
    # traffic here, and refuses to start where forwarding is off
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv6.conf.default.disable_ipv6: 1
    networks:
      # the microVMs' way out, and the namespace's default route (gw_priority:
      # Docker Engine 28+ and Compose 2.34.0+, as compose.workload-vmhost.yaml says)
      workload_vms:
        priority: 1000
        gw_priority: 1000
      # the rest of the stack: grafana, which vmhost sends its telemetry to
      default: {}

  workload-vmhost:
    build:
      context: .
      dockerfile: Dockerfile
      target: develop-workload-vmhost
      # what the host trusts, trusted while firecracker and the kernel are
      # fetched too: a network that inspects TLS breaks those downloads
      # otherwise. The Lima VM trusts the CA bundle it was made with
      # (LIMA_CA_CERTS).
      secrets:
        - ca-certificates
    profiles: ["microvm"]
    restart: unless-stopped
    privileged: true
    network_mode: service:workload-vmnet
    pid: host
    cgroup: host
    depends_on:
      - workload-vmnet
      - grafana
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "--unix-socket", "/run/workload-vmhost/vmhost.sock", "http://vmhost/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5
      # air builds it before it can answer
      start_period: 180s
    stop_grace_period: 30s
    volumes:
      - ./:/opt/app
      - /opt/app/tmp
      # the same path inside and on the host, which matters in systemd mode,
      # where the microVMs are the host's units and run what is kept there
      - /var/lib/workload-vmhost:/var/lib/workload-vmhost
      - workload-vmhost-run:/run/workload-vmhost
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /sys/fs/cgroup:/sys/fs/cgroup
      # registries are trusted as the host trusts them, a CA it was given to
      # get past a network that inspects TLS included
      - ${WORKLOAD_VMHOST_CA_CERTIFICATES:-/etc/ssl/certs/ca-certificates.crt}:/etc/ssl/certs/ca-certificates.crt:ro
    environment:
      # child: the microVMs are vmhost's children and end with it, which air
      # does at every change. systemd: they are units of the Lima VM and
      # outlive it, as in production.
      WORKLOAD_VMHOST_PROCESS_MODE: ${WORKLOAD_VMHOST_PROCESS_MODE:-child}
      WORKLOAD_VMHOST_MAX_MEMORY: ${WORKLOAD_VMHOST_MAX_MEMORY}
      # Lima gives its user the subordinate ids 524288-1074266111, which
      # overlap vmhost's default machine users (1000000000 on), so the
      # microVMs run as users from 2000000000 here.
      WORKLOAD_VMHOST_MACHINE_FIRST_UID: ${WORKLOAD_VMHOST_MACHINE_FIRST_UID:-2000000000}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}

  mongodb:
    image: mongo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "27017:27017"
    volumes:
      - ./tmp/mongodb/db:/data/db
      - ./tmp/mongodb/configdb:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

  mongodashboard:
    image: mongo-express
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mongodb
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: username
      ME_CONFIG_BASICAUTH_PASSWORD: password
      ME_CONFIG_MONGODB_URL: ${MONGO_SCHEME}://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}

  rustfs:
    image: rustfs/rustfs:latest
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
    ports:
      - "9100:9000"
      - "9001:9001"
    volumes:
      - ./tmp/rustfs:/data
    command: ["/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  rustfs_configure:
    image: rustfs/rc:latest
    security_opt:
      - no-new-privileges:true
    depends_on:
      rustfs: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
        rc alias set local http://rustfs:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
        rc bucket create -p local/${S3_BUCKET_NAME:-zuora-backup}
      "

  nats:
    image: nats:2.14-alpine3.22
    security_opt:
      - no-new-privileges:true
    command: ["--jetstream", "--http_port", "8222", "--port", "4222", "--store_dir", "/data"]
    ports:
      - "4222:4222" # client port
      - "6222:6222" # cluster post
      - "8222:8222" # HTTP monitoring port
    volumes:
      - ./tmp/nats:/data

  natsdashboard:
    image: ghcr.io/nats-nui/nui:0.7
    security_opt:
      - no-new-privileges:true
    depends_on:
      - nats
    ports:
      - "8082:31311"

  docker:
    image: docker:28-dind
    restart: unless-stopped
    privileged: true
    ports:
      - "2375:2375"
      # the range docker publishes a container's ports on. The workload proxies
      # them by hostname, so this is only for reaching one directly.
      - "32768-32868:32768-32868"
    environment:
      DOCKER_TLS_CERTDIR: "" # disable certs
    # dockerd's own Prometheus metrics endpoint on 0.0.0.0:9323
    command: ["--metrics-addr=0.0.0.0:9323", "--experimental"]

  portainer:
    image: portainer/portainer-ce
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - docker
    ports:
      - "9200:9000"
      - "9443:9443"
    command: >
      --admin-password="$$2a$$12$$4xcOa82Ni5rjgQF.v.JWi.i71OyUm3fwmfWiumgJHIAPGU.uOw3qu"
    # username: admin
    # password: admin-password
    # standalone docker API url: docker:2375

  mailserver:
    image: axllent/mailpit
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8092:8025" # web interface
      - "${MAIL_SMTP_PORT:-1025}:1025" # SMTP
    volumes:
      - ./tmp/mailpit/data:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db

  grafana:
    image: grafana/otel-lgtm:0.28.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3001:3000" # Grafana UI (host 3001: 3000 is already used by WEB_URL's frontend)
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./tmp/grafana-lgtm:/data
      - ./prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
    depends_on:
      - nats-exporter
      - mongodb-exporter

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.19.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - nats
    command: ["-varz", "-connz", "-routez", "-subz", "-jsz", "all", "http://nats:8222"]

  mongodb-exporter:
    image: percona/mongodb_exporter:0.51.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: ${MONGO_SCHEME}://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/admin
    command: ["--collector.diagnosticdata", "--collector.dbstats"]

networks:
  # the microVMs' way out, the workload-vmnet holder's alone
  workload_vms: {}

volumes:
  # vmhost's socket, shared with workload-orchestrator-01
  workload-vmhost-run: {}

secrets:
  # what the host trusts, for the downloads in vmhost's image build
  ca-certificates:
    file: ${WORKLOAD_BUILD_CA_CERTIFICATES:-/etc/ssl/certs/ca-certificates.crt}
