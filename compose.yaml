# app placement
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 120s
  stop_grace_period: 10s
  depends_on:
    - mongodb
    - nats
    - rustfs
    - rustfs_configure
    - mailserver
    - grafana
  volumes:
    - ./:/opt/app

# a node's engine: microsandbox, which runs VMs as microVMs on KVM, so it runs
# only where /dev/kvm is — Linux, or Lima on a Mac (CLAUDE.md, "VMs locally").
# It is behind the vms profile, so `make up` works without it; `make up-vms`
# brings it. It is the production image, as the engine is built only there.
x-vmhost: &vmhost
  profiles: ["vms"]
  build:
    context: .
    dockerfile: Dockerfile
    target: production-workload-vmhost
  restart: unless-stopped
  init: true
  user: "10001:10001"
  devices:
    - /dev/kvm
  # /dev/kvm's group where this runs: stat -c %g /dev/kvm
  group_add:
    - "${WORKLOAD_KVM_GID:-993}"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  cpus: ${WORKLOAD_VMHOST_CPUS_LIMIT:-2}
  # every VM on the node lives inside this. It offers 80% of it less 512 MiB,
  # which at 4g holds the 2 GiB Docker VM made for somebody's first container
  # or stack, as in production; at less, that VM fits on no node.
  mem_limit: ${WORKLOAD_VMHOST_MEMORY_LIMIT:-4g}
  pids_limit: 16384
  stop_grace_period: 120s
  healthcheck:
    test: ["CMD", "app", "check-workload-vmhost"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 5m

x-vmhost-environment: &vmhost-environment
  MSB_HOME: /data/msb
  WORKLOAD_VMHOST_SOCKET: /run/vmhost/vmhost.sock
  WORKLOAD_VMHOST_DOCKER_IMAGE: ${WORKLOAD_VM_DOCKER_IMAGE:-docker:29-dind}
  OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  PROFILING_ENABLED: ${PROFILING_ENABLED:-true}

services:
  app:
    <<: *app
    build:
      target: develop-blog
    ports:
      - "8000:80"
    environment:
      WEB_URL: ${WEB_URL}
      SERVICE_URL: ${SERVICE_URL}
      PRIVATE_KEY: ${PRIVATE_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_USE_SSL: ${S3_USE_SSL}
      MONGO_SCHEME: ${MONGO_SCHEME}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DATABASE_NAME: ${MONGO_DATABASE_NAME}
      MAIL_SMTP_FROM: ${MAIL_SMTP_FROM}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT}
      NATS_URL: ${NATS_URL}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}
      WORKLOAD_CONTROLPLANE_URL: ${WORKLOAD_CONTROLPLANE_URL}
      WORKLOAD_INGRESS_DOMAIN: ${WORKLOAD_PUBLIC_INGRESS_DOMAIN}

  workload-controlplane:
    <<: *app
    build:
      target: develop-workload-controlplane
    ports:
      - "8020:80"
    environment:
      MONGO_SCHEME: ${MONGO_SCHEME}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DATABASE_NAME: ${MONGO_DATABASE_NAME}
      NATS_URL: ${NATS_URL}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}
      # the bucket the nodes keep VM snapshots in, which the control plane
      # deletes them from
      WORKLOAD_SNAPSHOT_S3_ENDPOINT: ${S3_ENDPOINT}
      WORKLOAD_SNAPSHOT_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      WORKLOAD_SNAPSHOT_S3_SECRET_KEY: ${S3_SECRET_KEY}
      WORKLOAD_SNAPSHOT_S3_BUCKET: ${WORKLOAD_SNAPSHOT_S3_BUCKET}
      WORKLOAD_SNAPSHOT_S3_USE_SSL: ${S3_USE_SSL}

  workload-ingress:
    <<: *app
    build:
      target: develop-workload-ingress
    ports:
      # the ingress's own routes and, by hostname, the containers' exposed ports
      - "8030:80"
      # a forwarded port, carrying arbitrary TCP to an orchestrator through the tunnel
      - "8031:8031"
    environment:
      WORKLOAD_INGRESS_DOMAIN: ${WORKLOAD_INGRESS_DOMAIN}
      # where each task and VM is, heard as it is said: the ingress reads no
      # database.
      NATS_URL: ${NATS_URL}
      WORKLOAD_TUNNEL_CA_CERT: ${WORKLOAD_TUNNEL_CA_CERT}
      WORKLOAD_TUNNEL_CERT: ${WORKLOAD_INGRESS_TUNNEL_CERT}
      WORKLOAD_TUNNEL_KEY: ${WORKLOAD_INGRESS_TUNNEL_KEY}
      WORKLOAD_INGRESS_FORWARDS: ${WORKLOAD_INGRESS_FORWARDS}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}

  workload-orchestrator-01:
    <<: *app
    build:
      target: develop-workload-orchestrator
    ports:
      - "8040:80"
    networks:
      default: {}
      # its vmhost's, which it reaches VMs' published ports on; a VM takes
      # connections from this address alone.
      workload_vmhost_01:
        ipv4_address: 10.89.1.2
    volumes:
      - ./:/opt/app
      # the directory its vmhost's socket is in
      - workload_vmhost_01_run:/run/vmhost
    environment:
      WORKLOAD_ORCHESTRATOR_NAME: workload-orchestrator-01
      # where its vmhost serves the node's engine. Without the vms profile
      # nothing does, and its VMs fail saying the vmhost is not answering.
      WORKLOAD_VMHOST_SOCKET: /run/vmhost/vmhost.sock
      WORKLOAD_SNAPSHOT_S3_ENDPOINT: ${S3_ENDPOINT}
      WORKLOAD_SNAPSHOT_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      WORKLOAD_SNAPSHOT_S3_SECRET_KEY: ${S3_SECRET_KEY}
      WORKLOAD_SNAPSHOT_S3_BUCKET: ${WORKLOAD_SNAPSHOT_S3_BUCKET}
      WORKLOAD_SNAPSHOT_S3_USE_SSL: ${S3_USE_SSL}
      WORKLOAD_TUNNEL_ADDRESSES: ${WORKLOAD_TUNNEL_ADDRESSES}
      WORKLOAD_TUNNEL_CA_CERT: ${WORKLOAD_TUNNEL_CA_CERT}
      WORKLOAD_TUNNEL_CERT: ${WORKLOAD_ORCHESTRATOR_01_TUNNEL_CERT}
      WORKLOAD_TUNNEL_KEY: ${WORKLOAD_ORCHESTRATOR_01_TUNNEL_KEY}
      WORKLOAD_TUNNEL_SERVER_NAME: ${WORKLOAD_TUNNEL_SERVER_NAME}
      PUBLIC_KEY: ${PUBLIC_KEY}
      WORKLOAD_TUNNEL_ALLOWED_TARGETS: ${WORKLOAD_TUNNEL_ALLOWED_TARGETS}
      NATS_URL: ${NATS_URL}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}
  workload-orchestrator-02:
    <<: *app
    build:
      target: develop-workload-orchestrator
    ports:
      - "8041:80"
    networks:
      default: {}
      # its vmhost's, which it reaches VMs' published ports on; a VM takes
      # connections from this address alone.
      workload_vmhost_02:
        ipv4_address: 10.89.2.2
    volumes:
      - ./:/opt/app
      # the directory its vmhost's socket is in
      - workload_vmhost_02_run:/run/vmhost
    environment:
      WORKLOAD_ORCHESTRATOR_NAME: workload-orchestrator-02
      # where its vmhost serves the node's engine. Without the vms profile
      # nothing does, and its VMs fail saying the vmhost is not answering.
      WORKLOAD_VMHOST_SOCKET: /run/vmhost/vmhost.sock
      WORKLOAD_SNAPSHOT_S3_ENDPOINT: ${S3_ENDPOINT}
      WORKLOAD_SNAPSHOT_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      WORKLOAD_SNAPSHOT_S3_SECRET_KEY: ${S3_SECRET_KEY}
      WORKLOAD_SNAPSHOT_S3_BUCKET: ${WORKLOAD_SNAPSHOT_S3_BUCKET}
      WORKLOAD_SNAPSHOT_S3_USE_SSL: ${S3_USE_SSL}
      WORKLOAD_TUNNEL_ADDRESSES: ${WORKLOAD_TUNNEL_ADDRESSES}
      WORKLOAD_TUNNEL_CA_CERT: ${WORKLOAD_TUNNEL_CA_CERT}
      WORKLOAD_TUNNEL_CERT: ${WORKLOAD_ORCHESTRATOR_02_TUNNEL_CERT}
      WORKLOAD_TUNNEL_KEY: ${WORKLOAD_ORCHESTRATOR_02_TUNNEL_KEY}
      WORKLOAD_TUNNEL_SERVER_NAME: ${WORKLOAD_TUNNEL_SERVER_NAME}
      PUBLIC_KEY: ${PUBLIC_KEY}
      WORKLOAD_TUNNEL_ALLOWED_TARGETS: ${WORKLOAD_TUNNEL_ALLOWED_TARGETS}
      NATS_URL: ${NATS_URL}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}
  workload-orchestrator-03:
    <<: *app
    build:
      target: develop-workload-orchestrator
    ports:
      - "8042:80"
    networks:
      default: {}
      # its vmhost's, which it reaches VMs' published ports on; a VM takes
      # connections from this address alone.
      workload_vmhost_03:
        ipv4_address: 10.89.3.2
    volumes:
      - ./:/opt/app
      # the directory its vmhost's socket is in
      - workload_vmhost_03_run:/run/vmhost
    environment:
      WORKLOAD_ORCHESTRATOR_NAME: workload-orchestrator-03
      # where its vmhost serves the node's engine. Without the vms profile
      # nothing does, and its VMs fail saying the vmhost is not answering.
      WORKLOAD_VMHOST_SOCKET: /run/vmhost/vmhost.sock
      WORKLOAD_SNAPSHOT_S3_ENDPOINT: ${S3_ENDPOINT}
      WORKLOAD_SNAPSHOT_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      WORKLOAD_SNAPSHOT_S3_SECRET_KEY: ${S3_SECRET_KEY}
      WORKLOAD_SNAPSHOT_S3_BUCKET: ${WORKLOAD_SNAPSHOT_S3_BUCKET}
      WORKLOAD_SNAPSHOT_S3_USE_SSL: ${S3_USE_SSL}
      WORKLOAD_TUNNEL_ADDRESSES: ${WORKLOAD_TUNNEL_ADDRESSES}
      WORKLOAD_TUNNEL_CA_CERT: ${WORKLOAD_TUNNEL_CA_CERT}
      WORKLOAD_TUNNEL_CERT: ${WORKLOAD_ORCHESTRATOR_03_TUNNEL_CERT}
      WORKLOAD_TUNNEL_KEY: ${WORKLOAD_ORCHESTRATOR_03_TUNNEL_KEY}
      WORKLOAD_TUNNEL_SERVER_NAME: ${WORKLOAD_TUNNEL_SERVER_NAME}
      PUBLIC_KEY: ${PUBLIC_KEY}
      WORKLOAD_TUNNEL_ALLOWED_TARGETS: ${WORKLOAD_TUNNEL_ALLOWED_TARGETS}
      NATS_URL: ${NATS_URL}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}

  workload-vmhost-01:
    <<: *vmhost
    hostname: workload-vmhost-01
    networks:
      default: {}
      workload_vmhost_01:
        ipv4_address: 10.89.1.10
    volumes:
      - workload_vmhost_01_home:/data
      - workload_vmhost_01_run:/run/vmhost
    environment:
      <<: *vmhost-environment
      WORKLOAD_VMHOST_ADVERTISE_HOST: 10.89.1.10
      WORKLOAD_VMHOST_ORCHESTRATOR_IP: 10.89.1.2

  workload-vmhost-02:
    <<: *vmhost
    hostname: workload-vmhost-02
    networks:
      default: {}
      workload_vmhost_02:
        ipv4_address: 10.89.2.10
    volumes:
      - workload_vmhost_02_home:/data
      - workload_vmhost_02_run:/run/vmhost
    environment:
      <<: *vmhost-environment
      WORKLOAD_VMHOST_ADVERTISE_HOST: 10.89.2.10
      WORKLOAD_VMHOST_ORCHESTRATOR_IP: 10.89.2.2

  workload-vmhost-03:
    <<: *vmhost
    hostname: workload-vmhost-03
    networks:
      default: {}
      workload_vmhost_03:
        ipv4_address: 10.89.3.10
    volumes:
      - workload_vmhost_03_home:/data
      - workload_vmhost_03_run:/run/vmhost
    environment:
      <<: *vmhost-environment
      WORKLOAD_VMHOST_ADVERTISE_HOST: 10.89.3.10
      WORKLOAD_VMHOST_ORCHESTRATOR_IP: 10.89.3.2

  mongodb:
    image: mongo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "27017:27017"
    volumes:
      - ./tmp/mongodb/db:/data/db
      - ./tmp/mongodb/configdb:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

  mongodashboard:
    image: mongo-express
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mongodb
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: username
      ME_CONFIG_BASICAUTH_PASSWORD: password
      ME_CONFIG_MONGODB_URL: ${MONGO_SCHEME}://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}

  rustfs:
    image: rustfs/rustfs:latest
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
    ports:
      - "9100:9000"
      - "9001:9001"
    volumes:
      - ./tmp/rustfs:/data
    command: ["/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  rustfs_configure:
    image: rustfs/rc:latest
    security_opt:
      - no-new-privileges:true
    depends_on:
      rustfs: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      WORKLOAD_SNAPSHOT_S3_BUCKET: ${WORKLOAD_SNAPSHOT_S3_BUCKET}
    # the blog's bucket, and the one VM snapshots are kept in
    entrypoint: >
      /bin/sh -c "
        rc alias set local http://rustfs:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
        rc bucket create -p local/${S3_BUCKET_NAME:-zuora-backup} &&
        rc bucket create -p local/${WORKLOAD_SNAPSHOT_S3_BUCKET:-workload-snapshots}
      "

  nats:
    image: nats:2.14-alpine3.22
    security_opt:
      - no-new-privileges:true
    command: ["--jetstream", "--http_port", "8222", "--port", "4222", "--store_dir", "/data"]
    ports:
      - "4222:4222" # client port
      - "6222:6222" # cluster post
      - "8222:8222" # HTTP monitoring port
    volumes:
      - ./tmp/nats:/data

  natsdashboard:
    image: ghcr.io/nats-nui/nui:0.7
    security_opt:
      - no-new-privileges:true
    depends_on:
      - nats
    ports:
      - "8082:31311"

  mailserver:
    image: axllent/mailpit
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8092:8025" # web interface
      - "${MAIL_SMTP_PORT:-1025}:1025" # SMTP
    volumes:
      - ./tmp/mailpit/data:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db

  grafana:
    image: grafana/otel-lgtm:0.28.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3001:3000" # Grafana UI (host 3001: 3000 is already used by WEB_URL's frontend)
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./tmp/grafana-lgtm:/data
      - ./prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
    depends_on:
      - nats-exporter
      - mongodb-exporter

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.19.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - nats
    command: ["-varz", "-connz", "-routez", "-subz", "-jsz", "all", "http://nats:8222"]

  mongodb-exporter:
    image: percona/mongodb_exporter:0.51.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: ${MONGO_SCHEME}://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/admin
    command: ["--collector.diagnosticdata", "--collector.dbstats"]

networks:
  # each node's own: its orchestrator at .2 and its vmhost at .10, as in
  # production.
  workload_vmhost_01:
    ipam:
      config:
        - subnet: 10.89.1.0/24
          ip_range: 10.89.1.128/25
  workload_vmhost_02:
    ipam:
      config:
        - subnet: 10.89.2.0/24
          ip_range: 10.89.2.128/25
  workload_vmhost_03:
    ipam:
      config:
        - subnet: 10.89.3.0/24
          ip_range: 10.89.3.128/25

volumes:
  workload_vmhost_01_home:
  workload_vmhost_02_home:
  workload_vmhost_03_home:
  # a vmhost's socket, which its orchestrator shares: a tmpfs owned by group
  # 10001, whichever of the two mounts it first.
  workload_vmhost_01_run: &socket-volume
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=10001,gid=10001,mode=0770,size=1m
  workload_vmhost_02_run: *socket-volume
  workload_vmhost_03_run: *socket-volume
