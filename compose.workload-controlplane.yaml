services:
  workload-controlplane:
    image: ${WORKLOAD_CONTROLPLANE_IMAGE}
    security_opt:
      - no-new-privileges:true
    networks:
      - workload_controlplane
      - mongodb
      - nats
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 1
        order: start-first
        monitor: 90s
        delay: 5s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
        monitor: 90s
        delay: 5s
        failure_action: pause
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.20'
          memory: 150M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      WORKLOAD_MAX_LOG_BYTES: ${BACKEND_WORKLOAD_MAX_LOG_BYTES:-33554432}
      # the runtime classes a task may ask for, separated by commas, and the one
      # a task that names none is run with. A class is offered to users only
      # once it is here and a node offers it; taking it away turns new tasks of
      # it away and leaves running ones be.
      WORKLOAD_RUNTIMES: ${BACKEND_WORKLOAD_RUNTIMES:-sysbox}
      WORKLOAD_DEFAULT_RUNTIME: ${BACKEND_WORKLOAD_DEFAULT_RUNTIME:-sysbox}
      MONGO_SCHEME: ${BACKEND_MONGO_SCHEME}
      MONGO_USERNAME: ${BACKEND_MONGO_USERNAME}
      MONGO_PASSWORD: ${BACKEND_MONGO_PASSWORD}
      MONGO_HOST: ${BACKEND_MONGO_HOST}
      MONGO_PORT: ${BACKEND_MONGO_PORT}
      MONGO_DATABASE_NAME: ${BACKEND_MONGO_DATABASE_NAME}
      NATS_URL: ${BACKEND_NATS_URL}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}

networks:
  workload_controlplane:
    name: workload_controlplane
    external: true
  mongodb:
    name: mongodb
    external: true
  nats:
    name: nats
    external: true
  docker:
    name: docker
    external: true
  monitoring:
    name: monitoring
    external: true
