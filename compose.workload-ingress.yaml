services:
  workload-ingress:
    image: ${WORKLOAD_INGRESS_IMAGE}
    security_opt:
      - no-new-privileges:true
    networks:
      # everything that reaches the ingress: the proxy routes container
      # hostnames to it, and the orchestrators dial in. The control plane is not here --
      # it schedules over NATS and asks the ingress for nothing.
      - workload_ingress
      # where each task and VM is, which the nodes holding them say and the
      # control plane's commands to them change, heard as it is said: the
      # ingress reads no database.
      - nats
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      mode: replicated
      # one replica per address: an orchestrator's connections land on whichever
      # replica it dialled, and one name in front of several replicas hands
      # each connection to a different one. Several ingresses are had by
      # running several of these with an address each and naming them all in
      # WORKLOAD_TUNNEL_ADDRESSES, which is what an orchestrator keeps a pool per.
      replicas: 1
      endpoint_mode: vip
      update_config:
        parallelism: 1
        order: start-first
        monitor: 90s
        delay: 5s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
        monitor: 90s
        delay: 5s
        failure_action: pause
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.20'
          memory: 100M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      WORKLOAD_INGRESS_DOMAIN: ${BACKEND_WORKLOAD_INGRESS_DOMAIN}
      NATS_URL: ${BACKEND_NATS_URL}
      # the authority and this ingress's own certificate, as the PEM itself.
      # The authority's private key is deliberately not here: nothing that runs
      # needs it.
      WORKLOAD_TUNNEL_CA_CERT: ${BACKEND_WORKLOAD_TUNNEL_CA_CERT}
      WORKLOAD_TUNNEL_CERT: ${BACKEND_WORKLOAD_INGRESS_TUNNEL_CERT}
      WORKLOAD_TUNNEL_KEY: ${BACKEND_WORKLOAD_INGRESS_TUNNEL_KEY}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT: ${OTEL_EXPORTER_OTLP_PROFILES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-true}
      # ports arbitrary TCP arrives on, as listen=orchestrator:target. Nothing is
      # forwarded unless it is named here.
      WORKLOAD_INGRESS_FORWARDS: ${BACKEND_WORKLOAD_INGRESS_FORWARDS:-}

networks:
  workload_ingress:
    name: workload_ingress
    external: true
  nats:
    name: nats
    external: true
  monitoring:
    name: monitoring
    external: true
